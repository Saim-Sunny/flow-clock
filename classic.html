  const lg=sc.filter(s=>s.minutes>=40),sh=sc.filter(s=>s.minutes<20&&s.minutes>=5);if(lg.length>=2&&sh.length>=2){const d=avg(lg.map(s=>s.score))-avg(sh.map(s=>s.score));if(d>=8)st.push(["Longer sessions work for you",`flow ${A(lg.map(s=>s.score))} in 40+ minute sessions vs ${A(sh.map(s=>s.score))} in short ones`]);else if(d<=-8)wk.push(["Long sessions fade",`flow ${A(lg.map(s=>s.score))} after 40+ minutes vs ${A(sh.map(s=>s.score))} in short ones; take breaks`])}
  const dd=new Set(sessions.filter(s=>s.start>=Date.now()-7*864e5).map(s=>s.date)).size;if(dd>=5)st.push(["Consistent",`worked on ${dd} of the last 7 days`]);else if(dd<=2&&sessions.length>=4)wk.push(["Not consistent yet",`worked on ${dd} of the last 7 days`]);
  const wv=Object.values(water).filter(g=>g>0);if(wv.length>=3){const a=avg(wv);if(a>=7)st.push(["Well hydrated",`${a.toFixed(1)} glasses a day`]);else if(a<4)wk.push(["Low on water",`${a.toFixed(1)} glasses a day`])}
  const inR=x=>range==="all"||x.start>=Date.now()-Number(range)*864e5,ins=funs.filter(f=>inR(f)&&f.kind==="instead").reduce((a,f)=>a+(f.minutes||0),0);

/* ---------- Weekly: the Sunday article. Text comes from the Sunday task (summaries/<monday>), charts from that week's own data ---------- */
let weekSel=null;
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
function weekDays(ws){const b=new Date(ws+"T12:00").getTime();return [0,1,2,3,4,5,6].map(i=>isoDate(new Date(b+i*864e5)))}
function fmtD(ds,o){return new Date(ds+"T12:00").toLocaleDateString("en-GB",o)}
function svgBars(vals,labels,fmt,cls){
  const W=320,H=140,bw=28,gap=(W-7*bw)/6,mx=Math.max(1e-9,...vals);let h="";
  vals.forEach((v,i)=>{const x=i*(bw+gap),bh=v?Math.max(2,(H-36)*v/mx):0;

function svgStep(vals,labels){
  const W=320,H=140,top=16,bot=H-18,X=i=>14+i*(W-28)/6,Y=v=>bot-(bot-top)*v/100;let g="",d="",last=null,h="";

  vals.forEach((v,i)=>{if(v==null)return;d+=last==null?`M${X(i)} ${Y(v)}`:` H${X(i)} V${Y(v)}`;last=i});
  vals.forEach((v,i)=>{h+=`<text x="${X(i)}" y="${H-3}">${labels[i]}</text>`;if(v!=null)h+=`<circle class="${i===last?"end":"pt"}" cx="${X(i)}" cy="${Y(v)}" r="${i===last?5:3}"/><text class="val" x="${X(i)}" y="${Y(v)-9}">${Math.round(v)}</text>`});
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}<path class="line" d="${d}"/>${h}</svg>`}
function svgEnergy(pairs,labels){
  const W=320,H=150,top=12,bot=H-20,X=i=>14+i*(W-40)/6,Y=v=>bot-(bot-top)*(v-1)/4;let g="",h="";

    if(p.b!=null&&p.a!=null)h+=`<line class="line" x1="${X(i)}" y1="${Y(p.b)}" x2="${X(i)}" y2="${Y(p.a)}"/>`;
    if(p.b!=null)h+=`<circle class="open" cx="${X(i)}" cy="${Y(p.b)}" r="4"/>`;

function safeUrl(u){try{const x=new URL(u);return x.protocol==="https:"?x.href:""}catch(e){return ""}}

function svgTri(rows,labels){

function render(){

/* ---------- actions ---------- */
document.addEventListener("click",async e=>{

  const ds=el.dataset;

  if(ds.cat){draft.category=ds.cat;return renderNow()}
  if(ds.energy==="draft"){draft.energy=+ds.v;return renderNow()}
  if(ds.energy==="after"){fin.energyAfter=+ds.v;return renderNow()}
  if(ds.energy==="before"&&active){active.energyBefore=+ds.v;saveActive();return renderNow()}
  if(ds.acat&&active){active.category=ds.acat;draft.category=ds.acat;saveActive();return renderNow()}
  if(ds.water){const d=isoDate(new Date()),n=Math.max(0,(water[d]||0)+Number(ds.water));water={...water,[d]:n};renderNow();if(db)queue(()=>db.doc("water/"+d).set({date:d,glasses:n}));return}
  if(ds.scale){fin[ds.scale]=+ds.v;return renderNow()}
  if(ds.rmtodo!=null){draft.todos.splice(+ds.rmtodo,1);return renderNow()}
  if(ds.todo!=null&&active){active.todos[+ds.todo].done=el.checked;saveActive();const f=$("#small-field");if(f&&active.phase==="running"){f.innerHTML=smallField();return}return renderNow()}
  if(ds.range){range=ds.range;return renderInsights()}
  if(ds.week){weekSel=ds.week;renderWeekly();$("#sheet").scrollTop=0;markRead(ds.week);return}
  if(ds.openWeek)return openArticle(ds.openWeek);
  if(ds.edit){editId=ds.edit;confirmDelete=null;return renderHistory()}
  if(ds.editCancel){editId=null;return renderHistory()}
  if(ds.editSave)return saveEdit(ds.editSave);
  if(ds.openDay)return openDay(ds.openDay);
  if(ds.planOpen)return openPlan();
  if(ds.planToday)return openPlan(isoDate(new Date()));
  if(ds.openDp)return openDP();
  if(ds.dpPart!=null){dpPart=+ds.dpPart;return renderDP()}
  if(ds.dpTask!=null)return toggleDPTask(+ds.dpTask);
  if(ds.pday&&planDraft)return openPlan(ds.pday);

/* ---------- storage: Supabase (table "docs", see schema.sql) ----------
   A small adapter with the same shape the app used before: db.doc("col/id"), db.collection("col"),
   .set / .delete / .onSnapshot. Rows arrive live through Supabase Realtime. */
function stable(o){return o===undefined?"null":JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v)}
function supaDb(sb,uid){
  const cache={},listeners={},loading={};
  const emit=c=>(listeners[c]||new Set).forEach(fn=>fn());
  async function load(c){const {data,error}=await sb.from("docs").select("id,data").eq("collection",c);if(error)throw error;cache[c]=new Map(data.map(r=>[r.id,r.data]));emit(c)}
  function sub(c,fn,err){(listeners[c]=listeners[c]||new Set).add(fn);if(cache[c])fn();else if(!loading[c])loading[c]=load(c).catch(e=>{loading[c]=null;err&&err(e)});return()=>listeners[c].delete(fn)}
  sb.channel("docs-"+uid).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+uid},p=>{
    const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.collection||!cache[row.collection])return;
    if(p.eventType==="DELETE")cache[row.collection].delete(row.id);else cache[row.collection].set(row.id,row.data);emit(row.collection)}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)Object.keys(cache).forEach(c=>load(c).catch(()=>{}))});
  const doc=(c,id)=>({
    async set(d){if(cache[c]){cache[c].set(id,d);emit(c)}const {error}=await sb.from("docs").upsert({user_id:uid,collection:c,id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
    async delete(){if(cache[c]){cache[c].delete(id);emit(c)}const {error}=await sb.from("docs").delete().match({user_id:uid,collection:c,id});if(error)throw error},
    onSnapshot(next,err){return sub(c,()=>{const m=cache[c];next({exists:m.has(id),data:()=>m.get(id)})},err)}
  });
  return{doc:p=>{const [c,id]=p.split("/");return doc(c,id)},
    collection:c=>({doc:id=>doc(c,id),onSnapshot:(next,err)=>sub(c,()=>next({docs:[...cache[c]].map(([id,d])=>({id,data:()=>d}))}),err)})};
}
/* first sign-in: copy the sessions exported from the claude.ai version (import.json), once */
async function importOnce(sb,uid){
  const {data}=await sb.from("docs").select("id").eq("collection","meta").eq("id","imported");if(data&&data.length)return;
  let file=null;try{const r=await fetch("import.json",{cache:"no-store"});if(r.ok)file=await r.json()}catch(e){}
  const rows=(file&&file.docs||[]).map(d=>({user_id:uid,collection:d.collection,id:d.id,data:d.data}));
  rows.push({user_id:uid,collection:"meta",id:"imported",data:{at:Date.now(),count:rows.length}});
  const {error}=await sb.from("docs").upsert(rows,{ignoreDuplicates:true});if(error)throw error;
}
/* connect: create the client, sign in if needed, copy old data once */
const recovering=/type=recovery/.test(location.hash);
async function connectSupabase(){
  const cfg=window.FLOW_CLOCK_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||/YOUR-/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)){showBanner("Flow Clock isn't connected to Supabase yet. Add your project URL and key to config.js.");return null}
  const sb=sbClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let {data:{session}}=await sb.auth.getSession();
  if(session){const {error}=await sb.auth.getUser();if(error&&!/fetch|network/i.test(error.message||"")){await sb.auth.signOut({scope:"local"});session=null}}  // a stale login would load nothing
  if(!session)session=await signIn(sb);
  if(recovering)await newPassword(sb);
  document.body.classList.remove("signed-out");
  $("#signout").hidden=false;$("#signout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  try{await importOnce(sb,session.user.id)}catch(e){showBanner("Couldn't copy your earlier sessions: "+(e.message||e))}
  return supaDb(sb,session.user.id);
}

        <input type="email" id="auth-e" required placeholder="Email" autocomplete="email">
        <input type="password" id="auth-p" required minlength="8" placeholder="Password (8+ characters)" autocomplete="${mode==="in"?"current-password":"new-password"}">
        <button class="btn primary big" type="submit">${mode==="in"?"Sign in":"Create account"}</button>
      </form>
      <p class="small" id="auth-msg" style="margin:0">${esc(msg)}</p>
      ${mode==="in"?`<button class="btn ghost" id="auth-forgot" type="button">Forgot password?</button>`:""}
      <button class="btn ghost" id="auth-switch" type="button">${mode==="in"?"First time? Create your account":"Already have an account? Sign in"}</button>`;
      $("#auth-switch").onclick=()=>{mode=mode==="in"?"up":"in";draw()};
      if($("#auth-forgot"))$("#auth-forgot").onclick=async()=>{const email=$("#auth-e").value.trim();if(!email){$("#auth-msg").textContent="Type your email above first, then tap Forgot password.";return}
        $("#auth-msg").textContent="Sending…";const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
        $("#auth-msg").textContent=error?"Couldn't send the email: "+error.message:"Check your email and tap the reset link. It brings you back here to choose a new password."};
      $("#auth-form").onsubmit=async e=>{e.preventDefault();const email=$("#auth-e").value.trim(),password=$("#auth-p").value;$("#auth-msg").textContent=mode==="in"?"Signing in…":"Creating…";
        if(mode==="in"){const {error}=await sb.auth.signInWithPassword({email,password});if(error)$("#auth-msg").textContent=/confirm/i.test(error.message)?"Confirm your email first: tap the link in the email from Supabase, then sign in again.":"Couldn't sign in: "+error.message}
        else{const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
          if(error){$("#auth-msg").textContent="Couldn't create the account: "+error.message;return}
          if(!data.session){mode="in";draw("Account created. Open the email from Supabase and tap the confirm link once, then sign in here.")}}}};
    sb.auth.onAuthStateChange((ev,s)=>{if(s&&!a.hidden){a.hidden=true;resolve(s)}});
    draw();
  });
}

/* ---------- boot ---------- */
$("#today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const h=(location.hash||"").slice(1);if(["chat","now","plan","weekly","insights","history"].includes(h))tab=h;else if(isPhone())tab="chat";
render();
(async()=>{
  try{db=await connectSupabase()}catch(e){db=null;showBanner("Couldn't connect: "+(e.message||e))}
  if(!db){offline=true;$("#sync").textContent="Not syncing";return}
  $("#sync").textContent="Synced";$("#sync").classList.add("on");
  db.doc("state/active").onSnapshot(s=>{
    const data=s.exists?s.data():null;const key=stable(data);if(key===activeKey)return;activeKey=key;
    const wasPhase=active&&active.phase;active=data?clone(data):null;
    if(active&&active.phase==="finishing"&&wasPhase!=="finishing")fin={focus:0,output:0,energyAfter:0,word:"",note:noteFrom(active)};
    if(tab==="now")renderNow();
  },()=>{});
  db.collection("sessions").onSnapshot(s=>{sessions=s.docs.map(d=>({id:d.id,...d.data()}));if(tab!=="now"||!active)render()},err=>showBanner("Couldn't load your sessions. Reload the page to try again."));
  db.collection("water").onSnapshot(s=>{const w={};s.docs.forEach(d=>{const x=d.data();if(x&&x.date)w[x.date]=x.glasses||0});water=w;if(tab==="insights")renderInsights();else if(tab==="now"&&(!active||active.phase==="running"))renderNow()},loadErr);
  db.collection("summaries").onSnapshot(s=>{summaries=s.docs.map(d=>({id:d.id,...d.data()})).filter(w=>w.weekStart);if(tab==="now"&&!active)renderNow();else if(tab==="weekly")renderReports();else if(tab==="plan")renderPlanTab();if(!$("#sheet").hidden&&sheetMode==="article")renderWeekly()},loadErr);
  db.collection("dayplan").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.date)m[x.date]=x});dayplans=m;if(tab==="now"&&!active)renderNow();if(tab==="plan")renderPlanTab()},loadErr);
  db.doc("meta/tomorrow").onSnapshot(s=>{tomorrowCal=s.exists?s.data():null;if(!$("#sheet").hidden&&sheetMode==="plan"&&planDraft&&planDraft.view==="form")renderPlanForm()},()=>{});
  db.doc("meta/today").onSnapshot(s=>{todayCal=s.exists?s.data():null},()=>{});
  db.doc("meta/todoist").onSnapshot(s=>{todoist=s.exists?s.data():null},()=>{});
  db.doc("meta/repeats").onSnapshot(s=>{repeats=s.exists&&s.data().items||[];if(!$("#sheet").hidden&&sheetMode==="repeats")renderRepeats()},loadErr);
  db.collection("plan").onSnapshot(s=>{const pl={};s.docs.forEach(d=>{const x=d.data();if(x&&x.date)pl[x.date]=x});plans=pl;if(tab==="now"&&!active)renderNow();else if(tab==="plan")renderPlanTab()},loadErr);
  db.collection("daily").onSnapshot(s=>{dailies=s.docs.map(d=>d.data()).filter(x=>x&&x.date);if(tab==="now"&&!active)renderNow();else if(tab==="weekly")renderReports();if(!$("#sheet").hidden&&sheetMode==="day")renderDay()},loadErr);
  db.collection("fun").onSnapshot(s=>{funs=s.docs.map(d=>({id:d.id,...d.data()}));if(tab!=="now"||!active)render()},loadErr);
  db.collection("focus").onSnapshot(s=>{const f={};s.docs.forEach(d=>{const x=d.data();if(x&&x.date)f[x.date]=x});focusDays=f;if(tab==="now"&&!active)renderNow();else if(tab==="insights")renderInsights()},loadErr);
  db.collection("log").onSnapshot(s=>{const l={};s.docs.forEach(d=>{const x=d.data();if(x&&x.date)l[x.date]=x.entries||[]});logs=l;paintChatTab()},loadErr);
  db.collection("calq").onSnapshot(s=>{const q={};s.docs.forEach(d=>{q[d.id]=d.data()});calq=q;paintChatTab()},()=>{});
  db.doc("meta/articles").onSnapshot(s=>{readWeeks=new Set(s.exists&&s.data().read||[]);readDays=new Set(s.exists&&s.data().readDays||[]);if(tab==="now"&&!active)renderNow();else if(tab==="weekly")renderReports()},loadErr);
})();
})();
</script>
</body>
</html>
