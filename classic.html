<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e4e4df">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Flow Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Sunny Swiss (design system: claude.ai/artifact/9vTELa3nTR7vatAWgEEsYn), accent = signal-orange.
   Layout: one left-aligned column (max 720px) of flat tiles on a warm grey ground; stacked headline + segmented tabs on top; the Now tab is one tile whose hero is the giant timer numeral */
:root{
  --ground:#e4e4df; --surface:#f4f4f1; --paper:#ffffff; --ink:#111111; --ink-muted:#5e5e59; --hairline:#c8c8c2;
  --block:#111111; --on-block:#f4f4f1; --accent:#ff5a12; --on-accent:#111111; --accent-soft:#ffe3d3;
  --good:#1c7a4b; --bad:#b8322b; --focus:#111111; --heat0:#e9e9e4; --dp-cream:#f4ece6; --dp-card:#fffaf6; --dp-ink:#2a2420; --dp-muted:#8c8178; --dp-line:#e6dbd2; --dp-red:#d9503a; --band-beige:#eadfd6; --band-grey:#d9d9d7; --band-orange:#df6643; --band-ink:#111111; --post-bg:#151514; --post-ink:#f1f1ec; --post-muted:#a3a39c; --post-line:#3a3a36;
  --f-sans:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111110; --surface:#1c1c1a; --paper:#262624; --ink:#f1f1ec; --ink-muted:#a3a39c; --hairline:#3a3a37;
  --block:#f1f1ec; --on-block:#111110; --accent:#ff6a26; --on-accent:#111110; --accent-soft:#3a2216;
  --good:#4fc48f; --bad:#ff7d73; --focus:#f1f1ec; --heat0:#252523; --dp-cream:#1f1a17; --dp-card:#29231f; --dp-ink:#f1e9e2; --dp-muted:#a99d93; --dp-line:#3a322c; --dp-red:#e0624b; --band-beige:#3a322c; --band-grey:#2c2c2b; --band-orange:#d9603d; --band-ink:#f2f0ec; --post-bg:#1c1c1a; --post-line:#3a3a37; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#111110; --surface:#1c1c1a; --paper:#262624; --ink:#f1f1ec; --ink-muted:#a3a39c; --hairline:#3a3a37;
  --block:#f1f1ec; --on-block:#111110; --accent:#ff6a26; --on-accent:#111110; --accent-soft:#3a2216;
  --good:#4fc48f; --bad:#ff7d73; --focus:#f1f1ec; --heat0:#252523; --dp-cream:#1f1a17; --dp-card:#29231f; --dp-ink:#f1e9e2; --dp-muted:#a99d93; --dp-line:#3a322c; --dp-red:#e0624b; --band-beige:#3a322c; --band-grey:#2c2c2b; --band-orange:#d9603d; --band-ink:#f2f0ec; --post-bg:#1c1c1a; --post-line:#3a3a37; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
.signed-out main,.signed-out nav,.signed-out .theme{display:none!important}
.foot{display:flex;justify-content:center}
body{background:var(--ground);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
h1{font-weight:700;font-size:40px;letter-spacing:-.04em;margin:0;line-height:.94}
h1 small{display:block;font:500 12px var(--f-sans);color:var(--ink-muted);letter-spacing:.01em;margin-top:10px}
h2{font-weight:700;font-size:22px;margin:0;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
h3{font-size:12px;letter-spacing:.01em;color:var(--ink-muted);margin:0;font-weight:500}
nav{display:inline-flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink);max-width:100%;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none}
nav button{border:0;background:transparent;color:var(--ink);font:500 14px var(--f-sans);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;box-shadow:inset 0 0 0 1px var(--hairline);background:transparent;color:var(--ink);font:500 14px var(--f-sans);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);box-shadow:none;color:var(--on-accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{border:0;border-radius:var(--r);font:600 15px var(--f-sans);padding:12px 18px;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:none}
.btn.big{font-size:17px;padding:16px 22px;width:100%}
.btn.ghost{box-shadow:none;color:var(--ink-muted);padding:8px 4px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn.danger{box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.btn:disabled{opacity:.35;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],textarea{width:100%;font:15px var(--f-sans);color:var(--ink);background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r);padding:11px 12px}
textarea{min-height:84px;resize:vertical}
.todo-add{display:flex;gap:8px}
.todo-add input{flex:1;min-width:0}
ul.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.todos li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hairline);min-width:0}
ul.todos li:last-child{border-bottom:1px solid var(--hairline)}
ul.todos li span{flex:1;min-width:0;overflow-wrap:anywhere}
ul.todos li.done span{text-decoration:line-through;color:var(--ink-muted)}
ul.todos input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.x{border:0;background:transparent;color:var(--ink-muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
/* energy: five rising flat bars, lit in accent */
.battery{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.cells{display:flex;gap:5px;align-items:flex-end}
.cell{width:30px;border:0;border-radius:0;background:var(--heat0);box-shadow:inset 0 0 0 1px var(--hairline);cursor:pointer;padding:0}
.cell:nth-child(1){height:14px}.cell:nth-child(2){height:20px}.cell:nth-child(3){height:26px}.cell:nth-child(4){height:32px}.cell:nth-child(5){height:38px}
.cell.on{background:var(--accent);box-shadow:none}
.battery .lbl{font-size:13px;color:var(--ink-muted)}
/* rating scale */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:0;box-shadow:inset 0 0 0 1px var(--hairline);background:transparent;color:var(--ink);border-radius:var(--r);padding:10px 4px;cursor:pointer;font:500 12px var(--f-sans);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;text-align:left;padding-left:10px}
.scale button b{font:600 24px/1 var(--f-sans);letter-spacing:-.03em}
.scale button span{color:var(--ink-muted)}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.scale button[aria-pressed="true"] span{color:var(--surface);opacity:.75}
/* clock */
.clock{font:600 clamp(58px,17vw,108px)/.9 var(--f-sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:8px 0 4px}
.clock.paused{color:var(--ink-muted)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-sans);padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink)}
.pill.warn{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.distract{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--ink);padding-top:12px}
.distract b{font:500 40px/1 var(--f-sans);letter-spacing:-.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score{display:flex;align-items:center;gap:18px;border-top:1px solid var(--ink);padding-top:16px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%}
.ring .track{stroke:var(--hairline);stroke-width:1}
.ring .dot{fill:var(--accent)}
.ring .dot.off{fill:var(--hairline)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 34px/1 var(--f-sans);letter-spacing:-.04em}
.muted{color:var(--ink-muted)}
.small{font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
/* insights */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--ground);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:112px}
.stat b{display:block;font:500 34px/1 var(--f-sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-muted);order:-1}
.stat.accent{background:var(--accent);color:var(--on-accent)}
.stat.accent span{color:var(--on-accent);opacity:.75}
.callout{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:14px 16px;font-size:15px}
.callout strong{font-weight:700}
.heat-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:420px}
table.heat th{font:500 11px var(--f-sans);color:var(--ink-muted);padding:2px 4px;text-align:left}
table.heat td{height:46px;border-radius:2px;background:var(--heat0);text-align:left;vertical-align:top;padding:6px 8px;font:600 15px var(--f-sans);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
table.heat td small{display:block;font:500 10px var(--f-sans);color:var(--ink-muted);letter-spacing:0}
table.heat td.hot{color:var(--on-accent)}
table.heat td.hot small{color:var(--on-accent);opacity:.75}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:120px 1fr 52px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:1px;background:var(--hairline);position:relative;overflow:visible}
.bar .fill{height:2px;margin-top:-.5px;background:var(--ink);position:relative}
.bar .fill::after{content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translateY(-50%)}
.bar .fill[style*="width:0"]::after{display:none}
.bar .fill.amber{height:12px;margin-top:0;background:var(--accent);transform:translateY(-50%)}
.bar .fill.amber::after{display:none}
.bar .v{font:600 14px var(--f-sans);text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink);width:max-content}
.seg button{border:0;background:transparent;color:var(--ink);font:500 13px var(--f-sans);padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.entry{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;min-width:0}
.entry strong{font-weight:600;letter-spacing:-.01em}
.entry .meta{font-size:13px;color:var(--ink-muted);margin-top:4px}
.entry .note{grid-column:1/-1;font-size:14px;overflow-wrap:anywhere;border-top:1px solid var(--hairline);padding-top:8px}
.entry .sc{font:500 34px/1 var(--f-sans);letter-spacing:-.04em;align-self:start;text-align:right}
.entry .sc small{display:block;font:500 12px var(--f-sans);color:var(--ink-muted);letter-spacing:0;margin-top:4px}
.empty{padding:28px 20px;color:var(--ink-muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.empty p{max-width:52ch;margin:0}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-muted)}
.sync.on::before{background:var(--good)}
/* weekly summary */
.week{gap:14px}
.week p{margin:0;max-width:65ch}
.week .figs{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12px var(--f-mono);color:var(--ink-muted)}
.week .figs b{color:var(--ink)}
.week details summary{cursor:pointer;color:var(--ink-muted);font-size:13px;font-weight:500}
.week details[open] summary{margin-bottom:10px}
.week .older{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--hairline);padding-top:14px}
/* home: the Sunday article arrives as a notification card */
.notif{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--post-bg);color:var(--post-ink);border-radius:18px;padding:14px 16px;font:inherit;animation:fc-in .5s cubic-bezier(.2,.8,.2,1) both}
.notif-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.notif-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.notif-txt small{font:500 11px var(--f-mono);color:var(--post-muted);letter-spacing:.02em}
.notif-txt b{font:600 16px/1.25 var(--f-sans);letter-spacing:-.01em}
.notif-go{font:600 13px var(--f-sans);color:var(--accent);flex:none}
.home .term{width:100%;text-align:left}
.home .term-log{height:150px}
/* home feelings input: type and send, no conversation to read */
.feel{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.feel label{font:500 12px var(--f-mono);color:var(--ink-muted);letter-spacing:.02em}
.feel-row{display:flex;gap:8px;align-items:flex-end;border-bottom:1.5px solid var(--ink)}
.feel-row input[type=text]{flex:1;min-width:0;border:0;box-shadow:none;background:transparent;border-radius:0;font:500 18px var(--f-sans);padding:8px 0}
.feel-row input:focus-visible{outline:none}
.feel-row:focus-within{border-color:var(--accent)}
.feel-row .term-send{margin-bottom:6px}
.feel-reply{margin:0;min-height:1.4em;font:500 13px/1.45 var(--f-mono);color:var(--ink-muted)}
.feel-reply b{color:var(--ink)}
/* today's one thing */
.one{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.one label,.one-lbl{font:500 12px var(--f-mono);color:var(--ink-muted);letter-spacing:.02em}
.one-row{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);padding:6px 0 10px}
.one-text{flex:1;min-width:0;font:600 20px/1.25 var(--f-sans);letter-spacing:-.02em;overflow-wrap:anywhere}
.one.done .one-text{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-muted)}
.one-check{width:28px;height:28px;flex:none;border-radius:50%;border:0;box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;cursor:pointer;position:relative}
.one-check[aria-pressed="true"]{background:var(--accent);box-shadow:none}
.one-check[aria-pressed="true"]::after{content:"";position:absolute;left:10px;top:6px;width:6px;height:12px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
/* fun mode: the same circle in black */
.mode{display:flex;justify-content:center}
.go.fun{background:var(--block);color:var(--on-block)}
.go.fun.paused{background:transparent;box-shadow:inset 0 0 0 3px var(--block);color:var(--ink)}
.ask{width:100%;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;animation:fc-in .35s both}
.ask p{margin:0;font:600 17px/1.35 var(--f-sans);letter-spacing:-.01em}
.ask .grid2 .btn{width:100%}
.btn.blk{background:var(--block);color:var(--on-block);box-shadow:none}
.nudge{margin:0;font:500 13px/1.5 var(--f-mono);color:var(--ink)}
.nudge b{background:var(--accent-soft);padding:0 3px}
.kind{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-sans);padding:5px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink);vertical-align:middle}
.kind.instead{background:var(--block);color:var(--on-block);box-shadow:none}
.kind.reward{background:var(--accent);color:var(--on-accent);box-shadow:none}
.entry.fun{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.entry.fun .sc{font-size:22px}
.split{display:flex;height:16px;border-radius:2px;overflow:hidden;background:var(--heat0)}
.split i{display:block;height:100%}
.split .w{background:var(--accent)}
.split .p{background:var(--ink-muted)}
.split .x{background:var(--ink)}
.split .rw{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
/* nightly plan: today's checklist on Now, the form in the sheet */
.plan-card{gap:10px}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan-head h3{font:600 13px var(--f-sans);color:var(--ink)}
.plan-head span{font:500 12px var(--f-mono);color:var(--ink-muted)}
.plan-steps,.pf-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-steps li,.pf-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hairline);min-width:0}
.plan-steps li.done .ptxt{text-decoration:line-through;color:var(--ink-muted)}
.plan-steps .one-check{width:24px;height:24px}
.plan-steps .one-check[aria-pressed="true"]::after{left:8px;top:4px}
.ptag{font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);width:56px;flex:none}
.ptxt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.pf-ctl{display:flex;gap:2px;flex:none}
.pf-ctl .x:disabled{opacity:.25;cursor:default}
.pform{background:var(--surface);border-radius:var(--r);padding:22px 20px 26px;display:flex;flex-direction:column;gap:22px}
.pf-title{font-size:clamp(28px,6.4vw,40px);line-height:1.02;letter-spacing:-.035em;font-weight:600;margin:8px 0 0}
/* reports page: weekly cards are dark, day cards light */
.rep-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.rep-head h2{font-size:28px;letter-spacing:-.03em}
.art-card.day,.post.day{--post-bg:var(--surface);--post-ink:var(--ink);--post-muted:var(--ink-muted);--post-line:var(--hairline)}
.art-card.day{box-shadow:inset 0 0 0 1.5px var(--ink)}
.art-stats{font:500 12px var(--f-mono);color:var(--post-muted)}
.film.vid .poster{aspect-ratio:16/9}
.reality li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--post-line);font-size:15px}
.reality li b{width:18px;flex:none;color:var(--accent)}
.reality li.miss{color:var(--post-muted)}
.reality li.miss b{color:var(--post-muted)}
.reality{list-style:none;margin:0;padding:0}
/* night message + things that repeat */
.pf-text{width:100%;min-height:220px;resize:vertical;font:500 18px/1.6 var(--f-sans);color:var(--ink);background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:14px;padding:14px 16px}
.pf-text:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf-note{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.pf-note .btn.ghost{align-self:flex-start;padding:0}
.rep{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--hairline)}
.rep-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rep-top b{font:600 18px var(--f-sans)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px var(--hairline);background:transparent;color:var(--ink);font:600 13px var(--f-sans);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
/* day plan: cream cards, a red-orange sun, a part-of-day selector and a red-dot timeline */
.dp-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--dp-cream);color:var(--dp-ink);border-radius:20px;padding:16px;font:inherit;box-shadow:0 1px 0 var(--dp-line)}
.dp-card .dp-sun{width:34px;height:34px;flex:none}
.dp-card-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dp-card-txt small{font:500 11px var(--f-mono);color:var(--dp-muted)}
.dp-card-txt b{font:600 17px/1.25 var(--f-sans)}
.dp-card-txt span{font-size:13px;color:var(--dp-muted)}
.dp-card .notif-go{color:var(--dp-red)}
.dp-sun{display:inline-block;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f08a6c,var(--dp-red) 70%)}
.dp{background:var(--dp-cream);color:var(--dp-ink);border-radius:28px;padding:10px 10px 26px;display:flex;flex-direction:column;gap:22px}
.dp-hero{background:var(--dp-card);border-radius:22px;padding:18px 20px 22px;position:relative;overflow:hidden}
.dp-date{font:500 12px var(--f-mono);color:var(--dp-muted)}
.dp-big{display:flex;align-items:center;gap:14px;margin:10px 0 4px;position:relative}
.dp-big b{font:600 clamp(56px,16vw,76px)/.9 var(--f-sans);letter-spacing:-.04em;position:relative;z-index:1}
.dp-sun.lg{width:clamp(64px,18vw,86px);height:clamp(64px,18vw,86px);margin-left:-34px;opacity:.9}
.dp-hero h2{font:600 22px/1.2 var(--f-sans);letter-spacing:-.01em;margin:12px 0 6px}
.dp-hero p{margin:0;color:var(--dp-muted);max-width:52ch}
.dp-one{margin-top:16px;padding-top:12px;border-top:1px solid var(--dp-line);display:flex;flex-direction:column;gap:2px}
.dp-one small{font:500 11px var(--f-mono);color:var(--dp-muted)}
.dp-one b{font:600 19px var(--f-sans)}
.dp-one span{font-size:13px;color:var(--dp-red)}
.dp-parts{display:flex;justify-content:space-around;gap:4px;padding:0 6px}
.dp-parts button{border:0;background:none;color:var(--dp-muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 13px var(--f-sans);padding:6px 4px;min-width:62px}
.dp-parts .dp-p{display:grid;place-items:center;width:56px;height:56px;border-radius:50%}
.dp-parts button[aria-selected="true"]{color:var(--dp-ink)}
.dp-parts button[aria-selected="true"] .dp-p{box-shadow:inset 0 0 0 1px var(--dp-ink);font-weight:700}
.dp-parts i{width:6px;height:6px;border-radius:50%;background:var(--dp-red)}
.dp-parts em{font-style:normal;font-size:11px;color:var(--dp-muted);writing-mode:vertical-rl;letter-spacing:.08em;max-height:90px}
.dp-tl{background:var(--dp-card);border-radius:22px;padding:18px 18px 8px;position:relative}
.dp-tl::before{content:"";position:absolute;left:25px;top:24px;bottom:22px;width:1px;background:var(--dp-line)}
.dp-it{display:grid;grid-template-columns:16px 1fr;gap:12px;padding-bottom:16px;position:relative}
.dp-it .dot{width:9px;height:9px;border-radius:50%;background:var(--dp-red);margin:6px 0 0 3px;box-shadow:0 0 0 4px var(--dp-card)}
.dp-it.meal .dot{background:var(--dp-card);box-shadow:inset 0 0 0 2px var(--dp-red),0 0 0 4px var(--dp-card)}
.dp-it.event .dot{background:var(--dp-ink)}
.dp-it b{font:600 16px/1.3 var(--f-sans)}
.dp-it small{display:block;font:500 11px var(--f-mono);color:var(--dp-red);margin-top:2px}
.dp-it p{margin:4px 0 0;color:var(--dp-muted);font-size:14px;line-height:1.5}
.dp-rules{background:var(--dp-red);color:#fff;border-radius:22px;padding:18px 20px}
.dp-rules h3,.dp-sec h3{margin:0 0 10px;font:600 13px var(--f-sans)}
.dp-rules p{margin:0;padding:9px 0;border-top:1px solid rgba(255,255,255,.35);font:600 16px/1.4 var(--f-sans)}
.dp-rules p:first-of-type{border-top:0;padding-top:0}
.dp-sec{background:var(--dp-card);border-radius:22px;padding:18px 20px}
.dp-sec h3{color:var(--dp-muted)}
.dp-tasks{list-style:none;margin:0;padding:0}
.dp-tasks li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--dp-line)}
.dp-tasks li:first-child{border-top:0}
.dp-tasks li.done span{text-decoration:line-through;color:var(--dp-muted)}
.dp-tasks small{color:var(--dp-muted)}
.dp-tasks .one-check{width:24px;height:24px;box-shadow:inset 0 0 0 1.5px var(--dp-ink)}
.dp-tasks .one-check[aria-pressed="true"]{background:var(--dp-red);box-shadow:none}
.dp-tasks .one-check[aria-pressed="true"]::after{left:8px;top:4px;border-color:#fff}
.dp-meal{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--dp-line)}
.dp-meal:first-of-type{border-top:0}
.dp-meal small{font:500 11px var(--f-mono);color:var(--dp-red)}
.dp-meal b{font:600 16px var(--f-sans)}
.dp-meal p{margin:2px 0 0;font-size:14px;color:var(--dp-muted)}
/* reports: exhibition-style colour bands */
.rfilter{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.rfilter button{border:0;background:none;color:var(--ink-muted);font:500 13px var(--f-sans);padding:6px 10px;border-bottom:1.5px solid transparent;cursor:pointer}
.rfilter button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.bands{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
.band{display:flex;flex-direction:column;justify-content:space-between;width:100%;min-height:220px;border:0;text-align:left;cursor:pointer;color:var(--band-ink);font:inherit;padding:28px 22px 16px}
.band.beige{background:var(--band-beige)}.band.grey{background:var(--band-grey)}.band.orange{background:var(--band-orange);color:#111}
.band-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.band h2{margin:0;font:700 clamp(27px,7.4vw,34px)/1.05 var(--f-sans);letter-spacing:-.02em;max-width:13ch;text-wrap:balance}
.band .sub{margin:8px 0 0;font:600 14px/1.3 var(--f-sans)}
.band .arrow{flex:none;width:30px;height:20px;margin-top:6px}
.band .arrow path{stroke:currentColor;stroke-width:1.4;fill:none}
.band-foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid currentColor;padding-top:9px;margin-top:32px;font:400 12px var(--f-sans)}
.band .new{display:inline-block;font:600 11px var(--f-mono);margin-left:6px}
.rd{background:var(--paper);border-radius:var(--r);overflow:hidden;color:var(--band-ink)}
.rd-hero{padding:26px 22px 20px}
.rd-hero.beige{background:var(--band-beige)}.rd-hero.grey{background:var(--band-grey)}
.rd-hero h2{margin:0;font:700 clamp(32px,9vw,42px)/1.02 var(--f-sans);letter-spacing:-.025em;max-width:13ch}
.rd-hero .sub{margin:10px 0 0;font:600 15px/1.3 var(--f-sans)}
.rd-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid currentColor;margin-top:26px;padding-top:12px}
.rd-facts b{display:block;font:700 24px/1 var(--f-sans);letter-spacing:-.02em}
.rd-facts span{font:400 11.5px/1.3 var(--f-sans)}
.rd-body{padding:6px 22px 30px;color:var(--ink)}
.rd-sec{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--ink)}
.rd-sec:first-child{border-top:0}
.rd-sec h3{margin:0;font:700 13px/1.3 var(--f-sans)}
.rd-sec p{margin:0 0 10px;max-width:60ch}
.rd-sec p:last-child{margin-bottom:0}
.rd-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rd-sec li b{display:block}
.rd-sec li span{color:var(--ink-muted);font-size:14px}
.rd-sec li i{font-style:normal;font-size:14px;display:block;margin-top:2px}
.rd-num{counter-reset:n}
.rd-num li{counter-increment:n;display:grid;grid-template-columns:26px 1fr}
.rd-num li::before{content:counter(n);font-weight:700}
.rd-mood{font:700 32px/1 var(--f-sans);letter-spacing:-.02em;margin-bottom:6px}
.rd-check{display:flex;gap:8px}
.rd-check b{width:16px;flex:none}
.rd-check.miss{color:var(--ink-muted)}
.rd-vid{display:block;color:inherit;text-decoration:none;border:1px solid var(--ink)}
.rd-vid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.rd-vid div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font:600 14px var(--f-sans)}
/* weekly page: one card per Sunday article */
.arts-list{display:flex;flex-direction:column;gap:10px}
.art-card{display:flex;flex-direction:column;gap:10px;text-align:left;border:0;cursor:pointer;background:var(--post-bg);color:var(--post-ink);border-radius:22px;padding:20px 20px 22px;font:inherit}
.art-card .kicker{color:var(--post-muted)}
.art-card .kicker b{color:var(--accent);font-weight:600}
.art-title{font:500 clamp(24px,5.6vw,32px)/1.05 var(--f-sans);letter-spacing:-.03em;text-indent:12%}
.art-dek{font-size:15px;line-height:1.4;color:var(--post-muted)}
.art-go{font:600 13px var(--f-sans);color:var(--accent)}
/* the article opens as a sheet over the app and closes again */
.sheet{position:fixed;inset:0;z-index:30;background:var(--ground);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));animation:fc-fade .25s both}
.sheet>*{max-width:720px;margin-left:auto;margin-right:auto}
.sheet-bar{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:2;padding-bottom:10px}
.sheet-bar .btn{background:var(--surface)}
body.sheet-open{overflow:hidden}
/* strengths and weak spots: plain statements with the number behind them */
.sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.sw h3{font:600 13px var(--f-sans);color:var(--ink);margin:0 0 4px}
.sw.up h3::before{content:"▲ ";color:var(--accent)}
.sw.down h3::before{content:"▼ ";color:var(--ink)}
.sw-item{border-top:1px solid var(--hairline);padding:10px 0;display:flex;flex-direction:column;gap:3px}
.sw-item b{font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.sw-item span{font-size:13px;color:var(--ink-muted);line-height:1.4}
.sw-item i{font-style:normal;font-size:13px;color:var(--ink)}
.post .sw h3{color:var(--post-muted)}
.post .sw.down h3::before{color:var(--post-ink)}
.post .sw-item{border-color:var(--post-line)}
.post .sw-item span{color:var(--post-muted)}
.post .sw-item i{color:var(--post-ink)}
.post .sw-item b{font-size:18px}
.arts{display:flex;flex-direction:column}
.arts button{background:none;border:0;border-top:1px solid var(--hairline);text-align:left;padding:12px 0;color:var(--ink);font:500 15px var(--f-sans);cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.arts button span{color:var(--ink-muted);font-size:13px;flex:none}
body.phone .sw-grid{grid-template-columns:1fr}
/* session name: one big line at the top of a session */
.name-field input{font:600 22px/1.2 var(--f-sans);letter-spacing:-.02em;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;background:transparent;box-shadow:none;padding:6px 0 8px}
.name-field input::placeholder{color:var(--ink-muted);font-weight:500}
/* FLOW-86: the feelings chat, an old computer window in the Sunny Swiss palette */
.term{border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);overflow:hidden;font-family:var(--f-mono)}
.term-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--block);color:var(--on-block);padding:7px 10px;font:600 12px var(--f-mono);letter-spacing:.02em}
.term-bar .ttl{display:flex;align-items:center;gap:8px}
.term-bar .ttl i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.term-ctl{display:flex;gap:4px}
.term-ctl i{width:14px;height:14px;box-shadow:inset 0 0 0 1.5px var(--on-block);display:block}
.term-menu{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;border-bottom:1px solid var(--hairline);font:500 11px var(--f-mono);color:var(--ink-muted)}
.term-menu b{color:var(--ink)}
.term-log{height:200px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;font:500 13px/1.45 var(--f-mono)}
.msg{margin:0;overflow-wrap:anywhere;color:var(--ink)}
.msg b{font-weight:700;margin-right:7px}
.msg.you b::before{content:"■ ";color:var(--accent)}
.msg.bot{color:var(--ink-muted)}
.msg.bot b{color:var(--ink)}
.msg time{color:var(--ink-muted);font-size:11px;margin-right:7px}
.msg.typing::after{content:"▍";animation:fc-blink 1s steps(2) infinite}
@keyframes fc-blink{50%{opacity:0}}
.term-input{display:flex;align-items:center;gap:8px;border-top:1.5px solid var(--ink);padding:6px 6px 6px 12px}
.term-input:focus-within{background:var(--accent-soft)}
.term-input span{font:700 14px var(--f-mono);color:var(--accent)}
.term-input input[type=text]{flex:1;min-width:0;border:0;box-shadow:none;background:transparent;font:500 14px var(--f-mono);color:var(--ink);padding:7px 0}
.term-input input:focus-visible{outline:none}
.term-send{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font:700 12px var(--f-mono);padding:6px 12px;border-radius:2px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.term-send:active{transform:translate(2px,2px);box-shadow:none}
.term-send:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.post .bar .track{background:var(--post-line)}
.post .bar .v{color:var(--post-ink)}
/* home: one big start circle */
.home{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:28px 8px;text-align:center}
/* the dial: the same accent circle is the Start button and, once running, the timer (tap = pause) */
.dial{position:relative;width:min(84vw,350px);max-width:100%;aspect-ratio:1;display:grid;place-items:center}
.go{position:relative;width:calc(100% - 30px);aspect-ratio:1;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font:700 clamp(44px,14vw,68px)/1 var(--f-sans);letter-spacing:-.045em;cursor:pointer;transition:transform .12s,background-color .25s,box-shadow .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.go:active,.mini:active{transform:scale(.96)}
.go .t.time{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
.go .t.long{font-size:.78em}
.go .s{font:500 13px var(--f-sans);letter-spacing:0;opacity:.75}
.go.paused{background:transparent;box-shadow:inset 0 0 0 3px var(--accent);color:var(--ink)}
.ticks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ticks line{stroke:var(--hairline);stroke-width:2}
.ticks line.on{stroke:var(--ink)}
.live{display:flex;flex-direction:column;align-items:center;gap:24px;padding-top:12px}
.live .rest{width:100%}
.duo{display:flex;gap:32px;justify-content:center}
.mini{width:min(27vw,110px);aspect-ratio:1;border-radius:50%;border:0;box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;color:var(--ink);font:600 15px var(--f-sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .12s}
.mini b{font:500 32px/1 var(--f-sans);letter-spacing:-.04em}
.mini.stop{background:var(--block);color:var(--on-block);box-shadow:none}
.mini .sq{width:18px;height:18px;background:currentColor}
@keyframes fc-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fc-pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes fc-out{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.3)}}
@keyframes fc-time{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes fc-squeeze{0%{transform:scale(1)}35%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes fc-fade{from{opacity:0}to{opacity:1}}
.enter .go{animation:fc-squeeze .65s cubic-bezier(.3,.7,.2,1)}
.enter .go .was{position:absolute;animation:fc-out .35s ease-in both}
.enter .go .t,.enter .go .s{animation:fc-time .5s .25s cubic-bezier(.2,.8,.2,1) both}
.enter .ticks{animation:fc-fade .6s .4s both}
.enter .mini{animation:fc-pop .5s cubic-bezier(.2,.9,.3,1.25) both}
.enter .mini:nth-child(1){animation-delay:.5s}.enter .mini:nth-child(2){animation-delay:.6s}
.enter .rest{animation:fc-fade .3s .7s both}
.enter .rest>*{animation:fc-in .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.75s + var(--i,0)*.08s)}
/* phone preview on desktop */
.theme.phone-btn{display:none;position:fixed;right:24px;bottom:24px;z-index:5;background:var(--surface)}
@media (min-width:760px) and (hover:hover){.theme.phone-btn{display:inline-flex}}
.phone-btn::before{display:none}
body.phone{padding-block:32px}
body.phone .wrap{max-width:390px;height:844px;overflow-y:auto;border-radius:48px;box-shadow:0 0 0 10px var(--ink),0 0 0 11px var(--hairline);padding:52px 16px 32px;background:var(--ground);scrollbar-width:none}
body.phone .wrap::-webkit-scrollbar{display:none}
body.phone h1{font-size:34px}
body.phone .stats{grid-template-columns:1fr 1fr}
body.phone .bar{grid-template-columns:92px 1fr 44px}
body.phone .cell{width:24px}
body.phone .scale button{padding-left:7px}
body.phone .scale button span{font-size:10px}
body.phone .ring{width:100px;height:100px}
body.phone .dial{width:330px}
body.phone .mini{width:100px}
.home-meta{margin:0;color:var(--ink-muted);font-size:14px}
.home .card{width:100%;text-align:left}
.home .card .water{border-top:0;padding-top:0}
/* water */
.water{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:12px;width:100%}
.glasses{display:flex;gap:4px;margin-top:8px;flex-wrap:nowrap;align-items:center}
.glass{width:10px;height:18px;box-shadow:inset 0 0 0 1px var(--hairline)}
.glass.on{background:var(--accent);box-shadow:none}
.more{width:14px;height:18px;font:700 18px/18px var(--f-sans);color:var(--accent);text-align:center}
.wn{font:500 40px/1 var(--f-sans);letter-spacing:-.04em;min-width:2ch;text-align:right}
.water .btn{padding:10px 14px}
.chips.sm .chip{font-size:13px;padding:6px 11px}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme{border:0;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);border-radius:999px;font:500 13px var(--f-sans);padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.theme::before{content:"";width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
/* weekly article: a dark editorial panel (indented headline, label/text columns, triangle chart, [n] notes, film of the week) */
.post{background:var(--post-bg);color:var(--post-ink);border-radius:28px;padding:26px 22px 34px;display:flex;flex-direction:column;gap:34px}
.post p{margin:0 0 12px;max-width:62ch;font-size:15px;line-height:1.5}
.post-top{display:flex;justify-content:space-between;align-items:center}
.mark{display:inline-flex;gap:3px}
.mark i{width:24px;height:24px;border-radius:50%;background:var(--post-ink)}
.mark i+i{border-radius:0 12px 12px 0;width:12px;background:var(--accent)}
.kicker{font:500 12px var(--f-mono);color:var(--ink-muted);letter-spacing:.02em}
.post .kicker{color:var(--post-muted)}
.post-title{font-size:clamp(30px,7.4vw,46px);line-height:1.02;letter-spacing:-.035em;font-weight:500;margin:0;text-indent:18%;text-wrap:pretty}
.post .dek{font-size:17px;line-height:1.4;color:var(--post-muted);margin:16px 0 0;max-width:46ch}
.figs4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;border-top:1px solid var(--post-line);padding-top:14px}
.figs4 b{display:block;font:500 36px/1 var(--f-sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.figs4 span{font-size:12px;color:var(--post-muted)}
/* label / text rows, like an interview transcript */
.qa{display:grid;grid-template-columns:minmax(64px,22%) 1fr;gap:6px 18px;padding-top:16px;border-top:1px solid var(--post-line)}
.qa>b{font:700 13px/1.35 var(--f-sans);letter-spacing:-.005em;padding-top:2px}
.qa>div{min-width:0}
.qa>div p:first-child{font-weight:600}
/* film of the week: poster in black and white, fading into the accent */
.film{margin:0;display:flex;flex-direction:column;gap:12px}
.poster{position:relative;aspect-ratio:4/5;max-height:520px;overflow:hidden;background:var(--accent);border-radius:2px}
.poster img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);display:block}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--accent) 100%);pointer-events:none}
.poster .ptitle{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;font:600 clamp(24px,6vw,34px)/1 var(--f-sans);letter-spacing:-.03em;color:var(--on-accent)}
.film.noimg .poster img{display:none}
.film figcaption{display:grid;grid-template-columns:minmax(64px,22%) 1fr;gap:4px 18px;font-size:14px;line-height:1.45}
.film figcaption b{font:700 13px var(--f-sans)}
.film figcaption a{color:var(--post-ink);text-underline-offset:3px}
/* triangle chart: each day above (▲) or below (▼) its weekly average */
.tri-head{display:flex;gap:28px;margin-bottom:6px}
.tri-head span{display:flex;flex-direction:column;gap:6px;font:600 15px/1.2 var(--f-sans)}
.tri{width:100%;height:auto;overflow:visible}
.tri .row{stroke:var(--post-line);stroke-width:1}
.tri .up{fill:var(--accent)}
.tri .down{fill:var(--post-ink)}
.tri text{fill:var(--post-muted);font:500 10px var(--f-sans)}
.tri text.day{text-anchor:middle}
.tri-key{width:12px;height:11px}
h3.sec{font:600 13px/1.2 var(--f-sans);color:var(--post-muted);letter-spacing:.01em;margin:0 0 14px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:24px 28px}
.chart{min-width:0;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--post-line);padding-top:10px}
.chart h4{margin:0;font:500 12px var(--f-sans);color:var(--post-muted)}
.wchart{width:100%;height:auto;overflow:visible}
.wchart .bar{fill:var(--accent)}
.wchart .bar.ink{fill:var(--post-ink)}
.wchart text{fill:var(--post-muted);font:500 10px var(--f-sans);text-anchor:middle}
.wchart text.val{fill:var(--post-ink);font-weight:600}
.wchart text.ax{text-anchor:end}
.wchart .base{stroke:var(--post-ink);stroke-width:1}
.wchart .grid{stroke:var(--post-line);stroke-width:1}
.wchart .line{fill:none;stroke:var(--post-ink);stroke-width:2}
.wchart .pt{fill:var(--post-ink)}
.wchart .end{fill:var(--accent)}
.wchart .open{fill:var(--post-bg);stroke:var(--post-ink);stroke-width:1.5}
.mood-word{font:500 clamp(44px,11vw,72px)/.95 var(--f-sans);letter-spacing:-.05em;margin:0 0 14px;color:var(--accent)}
.moodline{display:flex;flex-wrap:wrap;gap:6px}
.post .pill{box-shadow:inset 0 0 0 1px var(--post-line);color:var(--post-ink)}
.reflect{margin:0;font-size:clamp(24px,5.6vw,34px);line-height:1.08;letter-spacing:-.03em;font-weight:500;text-indent:18%}
.reflect p{font-size:inherit;line-height:inherit;margin:0 0 .4em;max-width:none}
.notes{display:flex;flex-direction:column;gap:22px}
.note-n{display:flex;flex-direction:column;gap:8px}
.note-n b{font:300 clamp(46px,11vw,64px)/.9 var(--f-sans);letter-spacing:-.04em}
.note-n p{margin:0}
.archive{display:flex;flex-direction:column;border-top:1px solid var(--post-line);padding-top:10px}
.archive button{background:none;border:0;border-bottom:1px solid var(--post-line);text-align:left;padding:12px 0;color:var(--post-ink);font:500 15px var(--f-sans);cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.archive button[aria-current="true"]{font-weight:700}
.archive button span{color:var(--post-muted);font-size:13px;flex:none}
.teaser{gap:10px}
.teaser .post-title{font-size:26px;margin:4px 0 0}
body.phone .charts{grid-template-columns:1fr}
body.phone .figs4{grid-template-columns:1fr 1fr}
body.phone nav button{padding:7px 10px}
@media (max-width:560px){
  .sw-grid{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .figs4{grid-template-columns:1fr 1fr}
  nav button{padding:7px 10px}
  h1{font-size:34px}
  .stats{grid-template-columns:1fr 1fr}
  .bar{grid-template-columns:92px 1fr 44px}
  .cell{width:24px}
  .scale button{padding-left:7px}
  .scale button span{font-size:10px}
  .ring{width:100px;height:100px}
}
.sop{margin:0;padding-left:22px;display:grid;gap:8px;font-size:15px;line-height:1.45}
.sop li::marker{font:600 13px var(--f-mono);color:var(--accent)}
.sop-card{display:block;cursor:pointer}
.sop-card summary{list-style:none;display:flex}
.sop-card summary::-webkit-details-marker{display:none}
.sop-card[open] .sop{margin-top:12px}
/* ---------- plan form: boxed grid, like the SOP email ---------- */
.pg{max-width:760px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));color:var(--ink)}
.pg-c{border:1px solid var(--ink);margin:-.5px;padding:18px;min-width:0}
.pg-s2{grid-column:span 2}.pg-s3{grid-column:span 3}.pg-s4{grid-column:span 4}.pg-s6{grid-column:span 6}
@media (max-width:620px){.pg-s2,.pg-s3,.pg-s4{grid-column:span 6}}
.pg-brand{font:700 13px var(--f-sans);letter-spacing:.06em}
.pg-meta{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--ink-muted)}
.pg-lab{margin:0 0 4px;font:600 10px/1.2 var(--f-sans);letter-spacing:.08em;text-transform:uppercase}
.pg-n{font:500 11px var(--f-mono);color:var(--ink-muted)}
.pg-rule{width:22px;border-top:1px solid var(--ink);margin:10px 0 12px}
.pg-hint{margin:0 0 12px;font-size:13px;color:var(--ink-muted)}
.pg-hero{padding:26px 18px}
.pg-hero h2{margin:0;font:500 clamp(36px,7vw,50px)/1 var(--f-sans);letter-spacing:-.03em}
.pg-hero p:last-child{margin:12px 0 0;max-width:42ch;font-size:15px}
.pg-big{font:400 38px/1 var(--f-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pg-chips{display:flex;flex-wrap:wrap;gap:6px}
.pg-chip{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 12px;cursor:pointer;font:500 14px var(--f-sans);border-radius:0;min-width:40px}
.pg-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pg-fixed{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.pg-fixed li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--hairline);padding-bottom:6px;font-size:14px}
.pg-fixed li span{font:500 12px var(--f-mono);color:var(--ink-muted);white-space:nowrap}
.pg-fixed .pg-none{color:var(--ink-muted)}
.pg-x{border:0;background:none;color:var(--ink-muted);cursor:pointer;font-size:16px;padding:0 2px}
.pg-line{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font:400 16px var(--f-sans);border-radius:0;box-shadow:none;color:var(--ink)}
.pg-line:focus{outline:none;border-bottom-color:var(--accent)}
.pg-msg{min-height:80px;resize:vertical;border:1px solid var(--ink);padding:10px}
.pg-blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pg-blk{border:1px solid var(--ink);margin:-.5px;padding:12px 10px;text-align:left;background:transparent;color:var(--ink);cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;border-radius:0}
.pg-blk b{font:600 13px var(--f-sans)}
.pg-blk small{font:500 11px var(--f-mono);color:var(--ink-muted)}
.pg-blk em{font-style:normal;font:600 10px var(--f-sans);letter-spacing:.08em;text-transform:uppercase}
.pg-blk[data-v="free"]{background:var(--ink);color:var(--paper)}
.pg-blk[data-v="free"] small{color:var(--hairline)}
.pg-blk[data-v="half"]{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hairline) 6px 7px)}
.pg-blk[data-v="busy"] b,.pg-blk[data-v="busy"] em{color:var(--ink-muted)}
.pg-todo{list-style:none;margin:0;padding:0}
.pg-todo label{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);cursor:pointer;font-size:14.5px}
.pg-todo input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--ink);margin:1px 0 0;flex:none;border-radius:0;box-shadow:none;padding:0;background:transparent;display:grid;place-items:center}
.pg-todo input:checked{background:var(--ink)}
.pg-todo input:checked::after{content:"";width:8px;height:4px;border:2px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pg-todo small{display:block;font:500 11px var(--f-mono);color:var(--ink-muted)}
.pg-todo .p1 small{color:var(--accent)}
.pg-barbox{height:10px;border:1px solid var(--ink);position:relative;margin-top:8px}
.pg-barbox i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.pg-barbox i.over{background:var(--accent)}
.pg-verdict{margin:10px 0 0;font:600 13px var(--f-sans)}
.pg-verdict.over{color:var(--accent)}
.pg-sendc{display:flex}
.pg-send{flex:1;display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:16px;cursor:pointer;font:600 13px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;border-radius:0}
.pg-send:hover{background:var(--ink);color:var(--paper)}
.pg-link{border:0;background:none;color:var(--ink-muted);text-decoration:underline;cursor:pointer;font:500 13px var(--f-sans);padding:0}
.pg-task{display:grid;gap:10px}
.pg-taskh{display:flex;align-items:baseline;gap:10px}
.pg-taskh .pg-line{font:600 17px var(--f-sans)}
.pg-opt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-muted)}
.pg-stage{width:100%;border:1px solid var(--hairline);background:transparent;padding:8px 10px;font:400 14px var(--f-sans);resize:vertical;min-height:40px;border-radius:0;color:var(--ink);box-shadow:none}
.pg-stage:focus{outline:none;border-color:var(--ink)}
.pg-add{width:100%;border:0;background:transparent;padding:14px 18px;text-align:left;cursor:pointer;font:500 14px var(--f-sans);color:var(--ink-muted)}
.pg-add:hover{color:var(--ink)}
.pg-tchip{text-align:left}
.pg-err{color:var(--accent);font-size:13px}
.pg-note{font-size:13px;background:var(--accent-soft)}
.pg-note p{margin:0 0 4px}.pg-note p:last-child{margin:0}
.pg-send[disabled]{opacity:.6;cursor:wait}
.hp{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px 11px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
.hp:last-child{border-bottom:0}
.hp time{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.hp-t{min-width:0}
.hp-k{font:600 10px/1.2 var(--f-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.hp-st{font:500 15.5px/1.3 var(--f-sans);border:0;background:transparent;width:100%;padding:2px 0;outline:none;border-radius:0;box-shadow:none;color:var(--ink)}
input.hp-st:focus{border-bottom:1px solid var(--accent)}
.hp-ck{font:500 10.5px var(--f-mono);color:var(--ink-muted);margin-top:2px}
.hp-a{display:flex;align-items:center;gap:8px}
.hp-go{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 10px;cursor:pointer;font:600 11px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;border-radius:0}
.hp-go:hover{background:var(--ink);color:var(--paper)}
.hp-tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1px solid var(--ink);margin:0;cursor:pointer;display:grid;place-items:center;flex:none;border-radius:0;box-shadow:none;padding:0;background:transparent}
.hp-tick:checked{background:var(--ink)}
.hp-tick:checked::after{content:"";width:9px;height:5px;border:2px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.hp-done .hp-st{text-decoration:line-through;color:var(--ink-muted)}
.hp-brk,.hp-fix{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hairline) 6px 7px)}
.hp-brk .hp-st,.hp-fix .hp-st{color:var(--ink-muted)}
.hp-mv{border:1px solid var(--ink);background:transparent;color:var(--ink);width:30px;height:30px;padding:0;cursor:pointer;font:600 15px var(--f-sans);border-radius:0;display:grid;place-items:center}
.hp-mv:hover{background:var(--ink);color:var(--paper)}
@media (max-width:620px){#hp-list .hp{grid-template-columns:52px minmax(0,1fr)}#hp-list .hp-a{grid-column:2;justify-content:flex-start}#hp-list .hp-a:empty{display:none}}
.hp-a .hp-mv+.hp-mv{margin-left:-9px}
.hp-grip{cursor:grab;color:var(--ink-muted);font-size:16px;padding:0 2px;user-select:none;touch-action:none}
.pday{background:var(--paper);border:1.5px solid var(--ink);margin-bottom:-1.5px}
.pday summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
.pday summary::-webkit-details-marker{display:none}
.pday>summary span{display:flex;align-items:baseline;gap:10px;min-width:0}
.pday>summary b{font:600 18px var(--f-sans);letter-spacing:-.01em}
.pday>summary small{font:500 12px var(--f-mono);color:var(--ink-muted)}
.pday>summary em{font-style:normal;font:500 12px var(--f-mono);color:var(--ink-muted);white-space:nowrap;margin-left:auto}
.pday>summary::after{content:"+";font:400 20px/1 var(--f-sans)}
.pday[open]>summary::after{content:"–"}
.pday[open]>summary{border-bottom:1px solid var(--ink)}
.pday-body{display:grid}
.pday-move{display:grid;gap:8px;padding:12px 18px;border-bottom:1px solid var(--ink)}
.pday-move span{font:600 10px var(--f-sans);letter-spacing:.08em;text-transform:uppercase}
.pday-empty{margin:0;padding:14px 18px;color:var(--ink-muted);font-size:14px}
.pday-edit{padding:14px 18px;text-align:left;border-top:1px solid var(--ink)}
.pday-full{border-top:1px solid var(--ink)}
/* focused vs distracted inside a running session */
.fsplit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.fsplit>div{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fsplit span{font-size:12px;color:var(--ink-muted)}
.fsplit b{font:500 26px/1 var(--f-sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.fsplit.on>div:nth-child(2){background:var(--accent);color:var(--on-accent)}
.fsplit.on>div:nth-child(2) span{color:var(--on-accent);opacity:.75}
.ftrack{height:8px;border-radius:2px;background:var(--hairline);display:flex;overflow:hidden;width:100%}
.ftrack i{display:block;height:100%;background:var(--ink)}
.ftrack i.d{background:var(--accent)}
.mini.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.mini.on b{font-size:22px}
.live.distracted .go{background:var(--block);color:var(--on-block)}
ul.small-tasks li small{font:500 12px var(--f-mono);color:var(--ink-muted);white-space:nowrap}
ul.small-tasks li.now{background:linear-gradient(90deg,var(--accent-soft),transparent);border-left:3px solid var(--accent);padding-left:10px}
.now-tag{font:600 11px var(--f-sans);font-style:normal;background:var(--accent);color:var(--on-accent);padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
/* full day plan */
.tl-sum{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink)}
.tl-sum>div{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-sum>div+div{border-left:1px solid var(--ink)}
.tl-sum span{font:600 10px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.tl-sum b{font:500 22px/1 var(--f-sans);letter-spacing:-.03em}
.tl-sum>div.hi{background:var(--accent);color:var(--on-accent)}
.tl-sum>div.hi span{color:var(--on-accent);opacity:.75}
.hp.tl-flex{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--accent) 14%,transparent) 6px 12px)}
.hp.tl-flex .hp-k{color:var(--accent)}
.hp.tl-meal,.hp.tl-fixed,.hp.tl-sleep{background:var(--surface)}
.hp.tl-past{opacity:.45}
.hp.tl-taken{background:var(--accent);color:var(--on-accent)}
.hp.tl-taken .hp-k,.hp.tl-taken .hp-ck{color:var(--on-accent)}
.hp.tl-moved{background:var(--accent-soft)}
.hp .hp-ck b{color:var(--ink)}
.yes{display:grid;gap:12px;padding:16px 18px;border-top:1px solid var(--ink)}
.yes h4,.bsop h4{margin:0;font:600 10px var(--f-sans);letter-spacing:.08em;text-transform:uppercase}
.yes p{margin:0;font-size:13px;color:var(--ink-muted)}
.yes-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(112px,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.yes-form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink-muted);min-width:0}
.yes-form select{width:100%;font:15px var(--f-sans);color:var(--ink);background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r);padding:11px 8px}
.verdict{padding:14px 16px;display:grid;gap:4px;font-size:14px}
.verdict b{font:700 26px/1.05 var(--f-sans);letter-spacing:-.03em}
.verdict.yes{background:var(--ink);color:var(--surface)}
.verdict.maybe{background:var(--accent);color:var(--on-accent)}
.verdict.no{box-shadow:inset 0 0 0 2px var(--bad)}
.verdict.no b{color:var(--bad)}
.bsop{border-top:1px solid var(--ink)}
.bsop>summary{padding:14px 18px;font:600 10px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.bsop-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.bsop-grid>div{padding:14px 16px;min-width:0}
.bsop-grid>div+div{border-left:1px solid var(--ink)}
.bsop-grid ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:9px;font-size:14px;line-height:1.35}
.bsop-grid li span{display:block;font:500 11px var(--f-mono);color:var(--ink-muted)}
/* points */
.pts-big{font:600 clamp(72px,20vw,120px)/.85 var(--f-sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.pchart{position:relative;height:150px;border-bottom:1px solid var(--ink);display:grid;grid-template-columns:repeat(7,1fr);margin-top:22px}
.pchart .col{position:relative}
.pchart .stem{position:absolute;left:50%;bottom:0;width:1px;background:var(--ink)}
.pchart .dot{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;margin-bottom:-6px;border-radius:50%;background:var(--ink)}
.pchart .dot.hit{background:var(--accent)}
.pchart .goal{position:absolute;left:12%;right:12%;border-top:1.5px dashed var(--accent)}
.pchart .v{position:absolute;left:0;right:0;text-align:center;font:500 11px var(--f-mono);margin-bottom:10px}
.pdays{display:grid;grid-template-columns:repeat(7,1fr);font:500 11px var(--f-mono);color:var(--ink-muted);text-align:center;margin-top:6px}
.prules{margin:0;padding:0;list-style:none}
.prules li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--hairline);font-size:14px}
.prules b{font:500 13px var(--f-mono)}
@media (max-width:620px){
  .yes-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .yes-form label:first-child{grid-column:1/-1}
  .bsop-grid{grid-template-columns:1fr}
  .bsop-grid>div+div{border-left:0;border-top:1px solid var(--ink)}
  .tl-sum{grid-template-columns:1fr 1fr}
  .tl-sum>div:nth-child(3){border-left:0}
  .tl-sum>div:nth-child(n+3){border-top:1px solid var(--ink)}
  .fsplit b{font-size:21px}
}
.pday-full>summary{padding:14px 18px;font:600 10px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.sortable-ghost{opacity:.35}
/* ---------- chat (phone home): today's notes hang off one line ---------- */
/* Chat shows everywhere; phones open on it, the laptop opens on Now */
body.tab-chat .foot{display:none}
.chat{display:flex;flex-direction:column;padding:0 4px 8px 0;min-height:50vh}
.road{position:relative;padding:30px 0 16px 64px}
.road svg{position:absolute;left:0;top:0;width:64px;height:100%;overflow:visible}
.road path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.road circle{fill:var(--accent)}
.road h2{margin:0;font:700 28px/1.1 var(--f-sans);letter-spacing:-.02em}
.road p{margin:4px 0 0;font:500 12px var(--f-mono);color:var(--ink-muted)}
.chat .e{position:relative;display:grid;grid-template-columns:40px 24px minmax(0,1fr);padding-bottom:18px}
.chat .e::before{content:"";position:absolute;left:51px;top:0;bottom:0;width:2px;background:var(--hairline)}
.chat .e.done::before{background:var(--accent)}
.chat .e time{font:500 11px var(--f-mono);color:var(--ink-muted);text-align:right;padding-top:4px;font-variant-numeric:tabular-nums}
.chat .e .dot{position:relative;z-index:1;justify-self:center;margin-top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.chat .e.empty .dot{background:var(--hairline)}
.chat .e .txt{min-width:0;overflow-wrap:anywhere;font:500 16px/1.4 var(--f-sans);color:var(--ink)}
.chat .e.empty .txt{color:var(--ink-muted);font-weight:400}
.chat .e.ai{margin-top:-10px}
.chat .e.ai .dot{background:transparent}
.chat .e.ai .txt{font:400 14.5px/1.45 var(--f-sans);color:var(--ink-muted)}
.chat .e .txt.typing::after{content:"···";letter-spacing:2px;animation:fc-blink 1s steps(2) infinite}
.chat .e .txt small{display:block;margin-top:3px;font:500 11px var(--f-mono);color:var(--good)}
.ch-form{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--ground)}
.ch-box{flex:1;min-width:0;display:flex;align-items:center;background:var(--paper);border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--hairline);padding:4px 6px 4px 14px}
.ch-box:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ch-box input[type=text]{flex:1;min-width:0;border:0;box-shadow:none;background:transparent;border-radius:0;font:400 16px var(--f-sans);padding:8px 0;color:var(--ink)}
.ch-box input[type=text]:focus-visible{outline:none}
.ch-send{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.ch-send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

<button class="theme phone-btn" id="phone" type="button">Phone view</button>
<div class="wrap">
  <header>
    <h1>Flow<br>Clock<small><span id="today"></span> · <span id="sync" class="sync">Connecting…</span></small></h1>
    <div class="hdr-r">
      <nav aria-label="Sections">
        <button id="tab-chat" data-tab="chat">Chat</button>
        <button id="tab-now" data-tab="now">Now</button>
        <button id="tab-plan" data-tab="plan">Plan</button>

      </nav>

  <div id="banner" class="banner" hidden></div>

  <main id="view-now"></main>
  <main id="view-plan" hidden></main>
  <main id="view-weekly" hidden></main>
  <main id="view-insights" hidden></main>
  <main id="view-history" hidden></main>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Sunday article"><div class="sheet-bar"><button class="btn" id="sheet-close" type="button">Close</button></div><div id="sheet-body"></div></div>
  <div class="foot"><button class="btn ghost" id="signout" type="button" hidden>Sign out</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const CATS=[["study","Study"],["action","Action shift"],["editing","Video editing"],["jobs","Job applications"],["unicef","UNICEF PR"],["project","Own project"],["other","Other"]];
const CAT=Object.fromEntries(CATS);CAT.none="Not labelled";
const ENERGY=["Empty","Low","Okay","Good","Full"];
const FOCUS=["Scattered","Drifting","Steady","Focused","Deep flow"];
const OUTPUT=["Barely moved","A little","Solid","A lot","Crushed it"];
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const BLOCKS=[["morning","Morning","5–12"],["afternoon","Afternoon","12–17"],["evening","Evening","17–22"],["night","Night","22–5"]];

let db=null, offline=false, sessions=[], funs=[], focusDays={}, summaries=[], water={}, logs={}, readWeeks=new Set(), homeMode="work", funAsk=false, manualFun=false, active=null, activeKey="";
let draft={category:"study",energy:0,todos:[]};
let fin={focus:0,output:0,energyAfter:0,word:"",note:""};
let noteTimer=null, nameTimer=null, chatTyping=false, enterAnim=false, manual=false, confirmDiscard=false, confirmDelete=null, range="30";
let tab="now",calq={},sbClient=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function blockOf(h){return h>=5&&h<12?"morning":h>=12&&h<17?"afternoon":h>=17&&h<22?"evening":"night"}
function dayIdx(d){return (d.getDay()+6)%7}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hm(ms){const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dur(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?h+"h "+pad(m)+"m":m+"m"}
function elapsed(a,now){if(!a)return 0;const end=a.endedAt||now;const pausedNow=a.pausedAt&&!a.endedAt?now-a.pausedAt:0;return Math.max(0,end-a.startedAt-(a.pausedMs||0)-pausedNow)}
/* distraction runs as a second clock: the session clock keeps going, these minutes count as not focused */
function distractMs(a,now){if(!a)return 0;return (a.distractMs||0)+(a.dOn?(a.endedAt||now)-a.dOn:0)}
function endDistract(a,now){if(!a||!a.dOn)return;const m=Math.max(0,now-a.dOn);a.distractMs=(a.distractMs||0)+m;a.dLog=[...(a.dLog||[]),{at:a.dOn,min:Math.round(m/6e4*10)/10}];a.dOn=null}
/* points: 1 per focused minute, +15 when every small task (3 or more) of the session is done */
function pointsOf(s){const f=s.focusMin!=null?s.focusMin:(s.minutes||0);return Math.round(f)+(s.todosTotal>=3&&s.todosDone===s.todosTotal?15:0)}
function fmtClock(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}

/* Flow score 0–100: focus 35%, output 25%, to-dos 15%, distractions 15% (share of the session spent distracted), energy change 10% */
function flowScore(x){
  if(!x.focus||!x.output)return null;
  const f=(x.focus-1)/4,o=(x.output-1)/4;
  const t=x.todosTotal?x.todosDone/x.todosTotal:o;
  const parts=[[f,.35],[o,.25],[t,.15]];
  if(x.distractMin!=null&&x.minutes>0)parts.push([Math.max(0,1-x.distractMin/x.minutes*3),.15]);
  else if(x.distractions!=null&&x.minutes>0){const rate=x.distractions/Math.max(x.minutes/60,.25);parts.push([Math.max(0,1-rate/6),.15])}
  if(x.energyBefore&&x.energyAfter)parts.push([(x.energyAfter-x.energyBefore+4)/8,.10]);
  const w=parts.reduce((a,p)=>a+p[1],0);
  return Math.round(100*parts.reduce((a,p)=>a+p[0]*p[1],0)/w);
}
/* Dot ring: 48 spokes, lit up to the score (Sunny Swiss DotRing) */
function ring(score){
  const N=48;let h="";
  for(let i=0;i<N;i++){const a=-Math.PI/2+i/N*2*Math.PI,c=Math.cos(a),n=Math.sin(a),rd=40+((i*37)%11),on=score!=null&&i/N<score/100;
    h+=`<line class="track" x1="${60+c*34}" y1="${60+n*34}" x2="${60+c*56}" y2="${60+n*56}"/><circle class="dot${on?"":" off"}" cx="${(60+c*rd).toFixed(1)}" cy="${(60+n*rd).toFixed(1)}" r="2.4"/>`}
  return `<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true">${h}</svg><div class="num">${score==null?"–":score}</div></div>`;
}
function scoreWord(s){return s==null?"":s>=80?"Flow":s>=65?"Strong":s>=50?"Steady":s>=35?"Patchy":"Rough"}

/* ---------- storage ---------- */
let chain=Promise.resolve();
function queue(fn){chain=chain.then(fn).catch(e=>showBanner("Couldn't save: "+(e&&e.message||e)+". Check your connection and try again."));return chain}
function saveActive(){const body=active?clone(active):null;activeKey=stable(body);if(!db)return;queue(()=>body?db.doc("state/active").set(body):db.doc("state/active").delete())}
function showBanner(t){const b=$("#banner");b.textContent=t;b.hidden=!t}
const loadErr=()=>showBanner("Couldn't load your data. Close and reopen the app; if it stays empty, tap Sign out and sign in again.");

/* ---------- Now tab ---------- */
function energyPicker(id,val){
  let c="";for(let i=1;i<=5;i++)c+=`<button type="button" class="cell${i<=val?" on":""}" data-energy="${id}" data-v="${i}" aria-label="Energy ${i} of 5, ${ENERGY[i-1]}" aria-pressed="${i===val}"></button>`;
  return `<div class="battery"><div class="cells" role="group" aria-label="Energy level">${c}</div><span class="lbl">${val?val+"/5 · "+ENERGY[val-1]:"Tap to set"}</span></div>`;
}
function scale(id,val,labels){
  return `<div class="scale" role="group">`+labels.map((l,i)=>`<button type="button" data-scale="${id}" data-v="${i+1}" aria-pressed="${val===i+1}"><b>${i+1}</b><span>${l}</span></button>`).join("")+`</div>`;
}
function todoList(list,editable,checkable){
  if(!list.length)return `<p class="muted small" style="margin:0">${checkable?"No to-dos for this session.":"Add 3–5 things you want to get done."}</p>`;
  return `<ul class="todos">`+list.map((t,i)=>`<li class="${t.done?"done":""}">${checkable?`<input type="checkbox" id="todo-${i}" data-todo="${i}" ${t.done?"checked":""} aria-label="Done: ${esc(t.t)}">`:""}<span>${esc(t.t)}</span>${editable?`<button class="x" data-rmtodo="${i}" aria-label="Remove ${esc(t.t)}">×</button>`:""}</li>`).join("")+`</ul>`;
}
/* Water: one doc per day at water/<YYYY-MM-DD> */
function waterRow(){
  const n=water[isoDate(new Date())]||0;let g="";for(let i=0;i<8;i++)g+=`<span class="glass${i<n?" on":""}"></span>`;
  g+=`<span class="more">${n>8?"+":""}</span>`;
  return `<div class="water"><div><h3>Water today</h3><div class="glasses" aria-hidden="true">${g}</div></div>
    <div class="row"><span class="wn" aria-label="${n} glasses">${n}</span><button class="btn" data-water="-1" aria-label="Remove a glass" ${n?"":"disabled"}>−</button><button class="btn" data-water="1">+ Glass</button></div></div>`;
}
/* 60 ticks around the dial; the ones up to the current second are lit */
function ticksSvg(sec){let h="";const on=sec%60;for(let k=0;k<60;k++){const a=-Math.PI/2+k/60*2*Math.PI,c=Math.cos(a),n=Math.sin(a),r1=k%5?47:45.5;
  h+=`<line class="${k<on?"on":""}" x1="${(50+c*r1).toFixed(2)}" y1="${(50+n*r1).toFixed(2)}" x2="${(50+c*49.5).toFixed(2)}" y2="${(50+n*49.5).toFixed(2)}"/>`}
  return `<svg class="ticks" id="ticks" viewBox="0 0 100 100" aria-hidden="true">${h}</svg>`}
function fmtDial(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":"+pad(m):m)+":"+pad(s%60)}
/* FLOW-86 replies: a few honest one-liners, picked by keyword, else a plain acknowledgement */
const BOT=[[/tired|exhaust|sleepy|drained|low energy|no energy/i,"low battery detected. a glass of water and a stretch might help."],
  [/distract|phone|insta|tiktok|youtube|scroll|notification/i,"distraction logged. phone face down, back to one task."],
  [/stuck|blocked|confus|lost|don.?t know|no idea/i,"stuck is data. what is the smallest next step?"],
  [/stress|anx|overwhelm|panic|worr|pressure/i,"noted. breathe out slowly. you only need the next ten minutes."],
  [/bored|boring|meh|unmotivated/i,"boredom logged. set a tiny goal for the next 15 minutes."],
  [/hungry|food|eat|snack/i,"fuel low. a snack is maintenance, not slacking."],
  [/great|good|flow|focus|happy|nice|productive|proud|love/i,"good signal. ride it while it lasts."]];
const ACK=["received. keep going.","noted. one thing at a time.","logged. i'm listening.","copy that.","saved to memory. carry on.","understood. you're doing the work."];
function bestBlock(){const b=BLOCKS.map(([id,l])=>{const a=sessions.filter(s=>s.block===id&&s.score!=null).map(s=>s.score);return{id,l,m:avg(a),n:a.length}}).filter(x=>x.n>=2).sort((a,b)=>b.m-a.m);return b[0]||null}
/* a suggestion built from his own data: today's hours, last project, best time of day, water */
function suggestNow(){const today=isoDate(new Date()),tm=sessions.filter(x=>x.date===today).reduce((a,x)=>a+(x.minutes||0),0),w=water[today]||0,last=recentNames()[0],bb=bestBlock(),parts=[];
  if(tm>=240)parts.push(`you've done ${dur(tm)} today. a real break is a fine choice.`);
  else parts.push(last?`try a 25-minute session on "${last}".`:"try a 25-minute session on one clear task.");
  if(bb&&tm<240)parts.push(bb.id===blockOf(new Date().getHours())?`it's your best time of day (${bb.l.toLowerCase()}).`:`your best time is the ${bb.l.toLowerCase()}.`);
  if(w<4)parts.push(`drink a glass of water first (${w} today).`);
  return parts.join(" ")}
const SUGGEST=[[/\b(class|lecture|lesson|college|school|uni|seminar|course)\b/i,()=>"class logged. note one thing to act on after class, i'll keep it here."],
  [/what (should|can|do) i do|what now|suggest|any idea|free time|nothing to do/i,()=>suggestNow()],
  [/finished|done with|free now|after class|back home|i'm home|im home/i,()=>"free time detected. "+suggestNow()]];
function botReply(t,k){for(const [re,f] of SUGGEST)if(re.test(t))return f();for(const [re,a] of BOT)if(re.test(t))return a;return ACK[k%ACK.length]}
const inSession=()=>!!(active&&active.phase==="running");
function chatEntries(){return inSession()?(active.chat||[]):(logs[isoDate(new Date())]||[])}
function chatLines(){const c=chatEntries();
  return `<p class="msg bot"><b>flow-86</b>${inSession()?"hi. how are you feeling right now?":"hi. what are you up to, and how do you feel? ask me what to do next any time."}</p>`+c.map(m=>`<p class="msg ${m.from==="you"?"you":"bot"}"><b>${m.from==="you"?"you":"flow-86"}</b><time>${hm(m.t)}</time>${esc(m.text)}</p>`).join("")+(chatTyping?`<p class="msg bot typing"><b>flow-86</b></p>`:"")}
function paintChat(){const l=$("#term-log");if(!l)return;l.innerHTML=chatLines();l.scrollTop=l.scrollHeight}
function noteFrom(a){return [a.note,...(a.chat||[]).filter(m=>m.from==="you").map(m=>m.text)].filter(Boolean).join("\n")}
function recentNames(){const seen=new Set(),out=[];[...sessions].sort((a,b)=>b.start-a.start).forEach(x=>{const n=(x.name||"").trim();if(n&&!seen.has(n.toLowerCase())){seen.add(n.toLowerCase());out.push(n)}});return out.slice(0,10)}
function nameField(id,label){return `<div class="field name-field">${label?`<h3>${label}</h3>`:""}<input type="text" id="${id}" list="recent-names" maxlength="60" autocomplete="off" placeholder="What are you working on?" value="${esc(active.name||"")}" aria-label="Session name"><datalist id="recent-names">${recentNames().map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist></div>`}
/* home log: everything typed outside a session, one document per day at log/<YYYY-MM-DD> */
function logPut(day,entries){logs={...logs,[day]:entries};if(db)queue(()=>db.doc("log/"+day).set({date:day,entries}))}
/* home log: what he types is saved straight away; the nightly Day report and the next morning's plan read it */
/* FLOW-86 coach: Gemini through the Supabase function "flow-chat"; it knows his goal, today's plan and his SOP */
function coachContext(){const d=isoDate(new Date()),dp=dayplans[d],pm=plans[d],w=latestSop();
  const L=[`Now: ${new Date().toLocaleString("en-GB",{weekday:"long",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Amsterdam"})}.`];
  if(inSession())L.push(`In a work session: "${active.name||"unnamed"}", ${Math.round(elapsed(active,Date.now())/6e4)} min in, distractions ${active.distractions||0}${active.energyBefore?`, energy at start ${active.energyBefore}/5`:""}.`+((active.todos||[]).length?" To-dos: "+active.todos.map(x=>x.t+(x.done?" (done)":"")).join("; "):""));
  else L.push("Not in a work session right now.");
  if(dp){L.push(`Today's plan: ${dp.title||""}. Must finish: ${dp.oneThing&&dp.oneThing.text||"-"}${dp.oneThing&&dp.oneThing.hours?` (${dp.oneThing.hours} h)`:""}.`);
    if((dp.tasks||[]).length)L.push("Tasks: "+dp.tasks.map((x,i)=>x.t+((dp.done||{})[i]?" (done)":"")).join("; "));
    if((dp.rules||[]).length)L.push("Today's rules: "+dp.rules.join(" "))}
  else if(pm&&pm.mustFinish)L.push("Must finish today: "+pm.mustFinish);
  if(w)L.push(`His SOP this week (${w.sop.title||""}): `+sopList(w).join(" | "));
  L.push(`Worked today: ${Math.round(sessions.filter(x=>x.date===d).reduce((a,x)=>a+(x.minutes||0),0))} min.`);
  return L.join("\n")}
async function askCoach(t,history){if(!sbClient)throw new Error("offline");
  const {data,error}=await sbClient.functions.invoke("flow-chat",{body:{message:t,history,context:coachContext()}});
  if(error||!data||!data.reply)throw error||new Error("no reply");return data.reply}
/* home log: saved straight away; the coach answers a moment later (no answer if it can't be reached) */
function logSend(t,cb){const day=isoDate(new Date()),history=(logs[day]||[]).slice(-10).map(m=>({from:m.from,text:m.text}));
  logPut(day,[...(logs[day]||[]),{from:"you",t:Date.now(),text:t}].slice(-200));chatTyping=true;paintChat();paintChatTab();
  askCoach(t,history).then(rep=>{logPut(day,[...(logs[day]||[]),{from:"flow",t:Date.now(),text:rep}].slice(-200));cb&&cb(rep)}).catch(()=>{cb&&cb(null)})
    .finally(()=>{chatTyping=false;paintChat();paintChatTab()})}
/* the chat tab: today's notes on one line, newest at the bottom */
function chatTabLines(){const day=isoDate(new Date()),all=logs[day]||[],c=all.filter(m=>m.from==="you");
  let h=`<div class="road"><svg viewBox="0 0 64 100" preserveAspectRatio="none" aria-hidden="true"><path d="M44 46 H20 Q10 46 10 56 V70 Q10 80 20 80 H42 Q52 80 52 90 V100"/><circle cx="52" cy="46" r="6"/></svg><h2>Today</h2><p>${fmtD(day,{weekday:"long",day:"numeric",month:"long"})}</p></div>`;
  if(!c.length)h+=`<div class="e empty"><time></time><span class="dot"></span><div class="txt">What you're doing, what you need, how you feel. It all goes into tomorrow's plan.</div></div>`;
  all.forEach((m,i)=>{const later=all.slice(i+1).some(x=>x.from==="you");
    if(m.from!=="you"){h+=`<div class="e ai${later?" done":""}"><time></time><span class="dot"></span><div class="txt">${esc(m.text)}</div></div>`;return}
    const q=calq[day+"_"+m.t];h+=`<div class="e${later?" done":""}"><time>${hm(m.t)}</time><span class="dot"></span><div class="txt">${esc(m.text)}${q&&q.status==="added"?`<small>Added to your calendar</small>`:""}</div></div>`});
  if(chatTyping)h+=`<div class="e ai"><time></time><span class="dot"></span><div class="txt typing"></div></div>`;
  return h}
function paintChatTab(){const l=$("#ch-list");if(!l||tab!=="chat")return;l.innerHTML=chatTabLines();requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight))}
function renderChat(){const v=$("#view-chat");if(!$("#ch-list")){v.innerHTML=`<div class="chat" id="ch-list" aria-live="polite"></div>
  <form class="ch-form" id="ch-form"><div class="ch-box"><input type="text" id="ch-input" maxlength="2000" autocomplete="off" placeholder="What are you doing? How do you feel?" aria-label="Add a note"></div>
    <button class="ch-send" type="submit" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></form>`}
  paintChatTab()}
const isPhone=()=>!matchMedia("(min-width:760px)").matches||document.body.classList.contains("phone");

/* ---------- Insights ---------- */
function inRange(s){if(range==="all")return true;return s.start>=Date.now()-Number(range)*864e5}

  if(bl.length>=2&&bl[0].m-bl[bl.length-1].m>=8){const b=bl[0],w=bl[bl.length-1];st.push([`You focus best in the ${b.l.toLowerCase()}`,`average flow ${Math.round(b.m)} over ${b.n} sessions`]);wk.push([`${w.l} sessions score lower`,`average flow ${Math.round(w.m)}, ${Math.round(b.m-w.m)} points below your best time`])}
