<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow">
<meta name="theme-color" content="#ebebe6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Flow: Swiss poster. Warm ground, black type, one orange accent, hairlines, line-and-dot.
   Fixed things (lunch, calendar, Action) cut the day into blocks; NOW shows only the next step. Light only: one look on laptop and phone. */
:root{
  --ground:#ebebe6; --paper:#f7f7f3; --ink:#111; --muted:#6b6b65; --hair:#cfcfc8; --faint:#dcdcd5;
  --accent:#ff5a12; --soft:#ffe1cf;
  --f-sans:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--f-sans);font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0) 0 96px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.k{font:600 11px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.signed-out #line,.signed-out #view,.signed-out .dumpbar,.signed-out #signout{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px}
.brand b{font:800 22px/1 var(--f-sans);letter-spacing:-.04em}
.brand span{font:500 12px var(--f-mono);color:var(--muted)}
.menubtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .3s}
.menubtn svg,.iclose svg{width:22px;height:22px;fill:none;stroke:var(--paper);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menubtn:hover{transform:translateX(3px)}
.signed-out .menubtn{display:none}
/* the pages menu: a book index that slides in from the right */
.iveil{position:fixed;inset:0;background:rgba(17,17,17,.28);z-index:8;opacity:0;transition:opacity .35s}
.iveil.on{opacity:1}
.index{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fbfbf9;z-index:9;transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:28px 56px 32px;overflow:auto}
.index.on{transform:none}
.iclose{align-self:flex-end;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;display:grid;place-items:center}
.ilist{list-style:none;margin:auto 0;padding:40px 0;display:flex;flex-direction:column;gap:clamp(34px,6vh,62px)}
.ilist button{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.ilist .no{font:400 30px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em}
.ilist .tx b{display:block;font:600 14px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif}
.ilist .tx span{display:block;font:400 13px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#5d5d58}
.ilist button:hover b{text-decoration:underline;text-underline-offset:3px}
.ilist button[aria-current="page"] .no{color:var(--accent)}
.index .ilist li{opacity:0;transform:translateX(24px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.index.on .ilist li{opacity:1;transform:none}
.ifoot{display:flex;gap:22px;flex-wrap:wrap;font:400 13px "Helvetica Neue",Helvetica,Arial,sans-serif;padding-left:80px}
.ifoot button,.ifoot a{border:0;background:none;padding:0;color:#5d5d58;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}
@media (prefers-reduced-motion:reduce){.index,.index .ilist li,.iveil{transition:none}}
@media (max-width:600px){.index{padding:20px 26px 26px}.ilist button{grid-template-columns:56px 1fr}.ifoot{padding-left:58px}}
.banner{margin-top:14px;background:var(--soft);border-radius:6px;padding:10px 14px;font-size:14px}

/* the day as one line: black bars = fixed, dots = your steps, orange = now */
.line{position:relative;height:92px;margin:28px 0 0}
.line .base{position:absolute;left:0;right:0;top:46px;height:1px;background:var(--ink)}
.line .fx{position:absolute;top:41px;height:11px;background:var(--ink)}
.line .fx.past{opacity:.25}
.line .fxl{position:absolute;top:14px;font:600 11px var(--f-sans);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.line .fxl span{display:block;font:500 10px var(--f-mono);color:var(--muted)}
.line .st{position:absolute;top:42px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.line .st.cur{background:var(--accent);box-shadow:none;width:11px;height:11px;margin-left:-5.5px;top:41px}
.line .now{position:absolute;top:30px;width:2px;height:33px;margin-left:-1px;background:var(--accent)}
.line .nowl{position:absolute;top:66px;font:600 11px var(--f-mono);color:var(--accent);transform:translateX(-50%)}
.line .tick{position:absolute;top:70px;font:500 10px var(--f-mono);color:var(--muted);transform:translateX(-50%)}

/* NOW */
.now{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:48px;margin-top:30px;padding-top:26px;border-top:2px solid var(--ink)}
.hero{display:flex;flex-direction:column;gap:28px;min-height:420px}
.crumb{font:600 16px var(--f-sans)}
.crumb .due{font:600 11px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;margin-left:10px;padding:3px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink);vertical-align:2px}
.crumb .due.hot{background:var(--accent);box-shadow:none}
.step{font:700 clamp(44px,6.2vw,92px)/.98 var(--f-sans);letter-spacing:-.045em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.step.long{font-size:clamp(34px,4.4vw,62px);line-height:1.02}
.nudge{font:600 18px/1.3 var(--f-sans);color:var(--accent);margin:-12px 0 0}
.bars{display:flex;gap:5px}
.bars i{flex:1 1 0;max-width:26px;min-width:3px;height:4px;background:var(--faint)}
.bars i.d{background:var(--ink)} .bars i.c{background:var(--accent)}
.timer{font:600 clamp(96px,13vw,190px)/.82 var(--f-sans);letter-spacing:-.06em}
.timer small{font-size:.22em;letter-spacing:-.01em;color:var(--muted);margin-left:8px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto}
.btn{border:0;border-radius:999px;font:600 16px var(--f-sans);padding:16px 28px;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.go{background:var(--accent);box-shadow:none;padding:18px 44px;font-size:18px}
.btn.dark{background:var(--ink);color:var(--paper);box-shadow:none}
.btn.quiet{box-shadow:none;color:var(--muted);padding:14px 10px;text-decoration:underline;text-underline-offset:4px;font-weight:500}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.side{display:flex;flex-direction:column;gap:30px}
.count .n{font:600 clamp(72px,8vw,120px)/.85 var(--f-sans);letter-spacing:-.06em;color:var(--accent);margin-top:10px}
.count .n small{font-size:.38em;letter-spacing:-.03em;color:var(--ink);margin-left:4px}
.blk ol{list-style:none;margin:12px 0 0;padding:0}
.blk li{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px;color:var(--muted)}
.blk li:last-child{border-bottom:1px solid var(--hair)}
.blk li time{font:500 12px var(--f-mono);padding-top:2px}
.ask{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.ask p{margin:0;font:600 16px/1.3 var(--f-sans)}
.ask p.warn{color:var(--accent)}
.vlogbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 12px 12px 20px;cursor:pointer;text-align:left}
.vlogbtn b{font:700 15px var(--f-sans)}
.vlogbtn span{font:500 12px var(--f-mono);background:var(--accent);color:var(--ink);border-radius:999px;padding:5px 11px}
.lens{display:flex;gap:8px;flex-wrap:wrap}
.lens input{position:absolute;opacity:0}
.lens span,.lens button{display:block;padding:8px 15px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);cursor:pointer;font-weight:600;font-size:14px;border:0;background:none}
.lens input:checked+span,.lens button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lens input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* dump bar: always at the bottom */
.dumpbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);z-index:4;padding-bottom:env(safe-area-inset-bottom,0)}
.dumpbar form{max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;gap:14px;align-items:center}
.dumpbar label{font:600 11px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;opacity:.6;white-space:nowrap}
.dumpbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--paper);font:500 17px var(--f-sans);padding:8px 0;border-bottom:1px solid rgba(247,247,243,.3);border-radius:0}
.dumpbar input::placeholder{color:rgba(247,247,243,.45)}
.dumpbar input:focus{outline:none;border-bottom-color:var(--accent)}
.dumpbar .ct{font:500 12px var(--f-mono);opacity:.6;white-space:nowrap}
.dumpbar button{border:0;border-radius:999px;background:var(--accent);color:var(--ink);font:600 14px var(--f-sans);padding:10px 18px;cursor:pointer}
.dumpbar #calbtn{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px rgba(247,247,243,.35);font-weight:500;white-space:nowrap}
.dumpbar #calbtn[aria-pressed=true]{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cals{list-style:none;margin:18px 0 0;padding:0;max-width:820px;border-top:2px solid var(--ink)}
.cals li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--hair);font-size:16px}
.cals time{font:500 12px var(--f-mono);color:var(--muted)}
.cals em{font:600 11px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;font-style:normal;color:var(--muted)}
.cals li.added em{color:var(--ink)}.cals li.waiting em{color:var(--accent-ink,var(--ink))}

/* vlog prompt card */
.toast{position:fixed;right:24px;bottom:84px;width:min(390px,calc(100vw - 32px));background:var(--paper);box-shadow:0 0 0 1.5px var(--ink),0 18px 40px rgba(0,0,0,.16);border-radius:6px;padding:18px 20px;z-index:7;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.tk{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tk b{font:800 30px/1 var(--f-sans);letter-spacing:-.04em;color:var(--accent);text-transform:uppercase}
.tk span{font:500 11px var(--f-mono);color:var(--muted)}
.tt{font:700 21px/1.15 var(--f-sans);letter-spacing:-.02em;margin:10px 0 6px}
.tp{color:var(--muted);font-size:14px;margin:0 0 14px}
.ta{display:flex;gap:10px;align-items:center}
.ta .btn{padding:11px 22px;font-size:15px}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(235,235,230,.95);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;z-index:6;overflow:auto}
.sheet{max-width:640px;width:100%;display:flex;flex-direction:column;gap:18px;padding:20px 0}
.sheet h2{font:700 44px/1 var(--f-sans);letter-spacing:-.04em;margin:0}
.sheet p{margin:0;color:var(--muted);font-size:16px}
.opt{display:grid;grid-template-columns:40px 1fr auto;gap:2px 16px;align-items:center;text-align:left;border:0;border-top:1px solid var(--ink);background:none;padding:18px 0;cursor:pointer;width:100%}
.opt:last-of-type{border-bottom:1px solid var(--ink)}
.opt .i{grid-row:1/3;font:600 30px/1 var(--f-sans);letter-spacing:-.04em}
.opt b{font:600 20px var(--f-sans)}
.opt span{grid-column:2;font-size:14px;color:var(--muted)}
.opt em{grid-row:1/3;grid-column:3;font:500 12px var(--f-mono);font-style:normal;color:var(--muted)}
.opt:hover b{text-decoration:underline;text-underline-offset:4px}
.opt.best .i,.opt.best em{color:var(--accent)}
.bigin{border:0;border-bottom:2px solid var(--ink);background:transparent;font:600 26px var(--f-sans);padding:8px 0;border-radius:0;width:100%}
.bigin:focus{outline:none;border-bottom-color:var(--accent)}
.story{margin:0;display:grid;grid-template-columns:110px 1fr;gap:12px 18px;border-top:2px solid var(--ink);padding-top:16px}
.story dt{font:600 11px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.story dd{margin:0;font:600 18px/1.3 var(--f-sans)}
.outline{list-style:none;margin:0;padding:0}
.outline li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--hair);align-items:start}
.outline li:last-child{border-bottom:1px solid var(--hair)}
.outline time{font:500 12px var(--f-mono);color:var(--muted);padding-top:3px}
.outline b{font:700 17px var(--f-sans)}
.outline em{font:500 11px var(--f-mono);font-style:normal;color:var(--muted)}
.outline p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.outline li.cur time,.outline li.cur b{color:var(--accent)}
.outline .got{display:flex;gap:4px;padding-top:6px}
.outline .got i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink)}
.outline .got i.on{background:var(--accent);box-shadow:none}

/* pages */
.page{margin-top:34px;padding-top:26px;border-top:2px solid var(--ink)}
.page h1{font:700 clamp(40px,5vw,64px)/.98 var(--f-sans);letter-spacing:-.045em;margin:0;max-width:18ch}
.page .lead{margin:14px 0 0;color:var(--muted);font-size:16px;max-width:56ch}
.small{font-size:13px}
.dumps{list-style:none;margin:30px 0 0;padding:0;border-top:2px solid var(--ink);max-width:820px}
.dumps li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--hair);font-size:16px}
.dumps time{font:500 12px var(--f-mono);color:var(--muted)}
.dumps .a{display:flex;gap:6px}
.dumps li.kept span{color:var(--muted)}
.mini{border:0;box-shadow:inset 0 0 0 1px var(--hair);background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.map{display:grid;grid-template-columns:44px repeat(14,minmax(0,1fr));gap:4px;margin-top:34px;align-items:end}
.map .h{font:500 10px var(--f-mono);color:var(--muted);text-align:center}
.map .d{font:500 11px var(--f-mono);color:var(--muted);align-self:center}
.map .c{height:34px;position:relative;border-bottom:1px solid var(--hair)}
.map .c i{position:absolute;left:50%;bottom:0;width:1px;background:var(--ink)}
.map .c b{position:absolute;left:50%;width:9px;height:9px;margin:0 0 -4.5px -4.5px;border-radius:50%;background:var(--ink)}
.map .c b.hot{background:var(--accent);width:11px;height:11px;margin:0 0 -5.5px -5.5px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;margin-top:40px}
.fact{border-top:2px solid var(--ink);padding-top:12px}
.fact .big{font:600 52px/.9 var(--f-sans);letter-spacing:-.05em;margin:8px 0 10px}
.fact .big.a{color:var(--accent)}
.fact p{margin:0;font-size:14px;color:var(--muted)}
.habits{list-style:none;margin:30px 0 0;padding:0;border-top:2px solid var(--ink)}
.habits li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 70px 24px;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--hair)}
.hn b{display:block;font:700 30px/1 var(--f-sans);letter-spacing:-.035em}
.hn span{font:500 12px var(--f-mono);color:var(--muted)}
.week{display:flex;gap:6px}
.dd{flex:1;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.dd i{width:22px;height:22px;border-radius:50%;background:var(--faint);position:relative}
.dd.plan i{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.dd.done i{background:var(--accent)}
.dd.miss i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.dd.miss i::after{content:"";position:absolute;left:4px;right:4px;top:10px;height:1.5px;background:var(--muted);transform:rotate(-45deg)}
.dd span{font:500 11px var(--f-mono);color:var(--muted)}
.dd.today span{color:var(--ink);font-weight:700;border-bottom:2px solid var(--accent)}
.hc{font:500 13px var(--f-mono);color:var(--muted);text-align:right}
.hc b{font:600 34px/1 var(--f-sans);letter-spacing:-.04em;color:var(--ink)}
.hdel{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;opacity:.5}
.hdel:hover{opacity:1}
.hadd{display:flex;flex-direction:column;gap:14px;margin-top:40px;padding-top:18px;border-top:2px solid var(--ink);max-width:720px}
.rgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;margin-top:36px}
.kinds{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.kinds button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:16px 0;cursor:pointer}
.kinds b{font:700 24px/1 var(--f-sans);letter-spacing:-.03em}
.kinds span{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.kinds button[aria-current="true"] b{color:var(--accent)}
.kinds button.empty b{color:var(--muted)}
.rhead{border-top:2px solid var(--ink);padding-top:14px}
.rsum{font:700 clamp(26px,3vw,36px)/1.08 var(--f-sans);letter-spacing:-.035em;margin:0}
.rsum em{font-style:normal;color:var(--accent)}
.rhead .lens{margin-top:14px}
.stage{margin-top:30px}
.stage h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.stage h3 b{font:600 11px var(--f-sans);letter-spacing:.1em;text-transform:uppercase}
.stage h3 .x{font:700 14px var(--f-sans);color:var(--accent)}
.stage h3 i{font:500 12px var(--f-mono);font-style:normal;color:var(--muted)}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:grid;grid-template-columns:26px minmax(0,1fr) 52px 24px;gap:10px;align-items:center;border-top:1px solid var(--hair);padding:4px 0}
.rlist li::before{content:"";width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink)}
.rlist input{border:0;background:transparent;font:500 16px var(--f-sans);padding:8px 0;min-width:0;border-bottom:1px solid transparent;border-radius:0}
.rlist input:focus{outline:none;border-bottom-color:var(--accent)}
.rlist input.m{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.rlist .del{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0;opacity:0}
.rlist li:hover .del,.rlist .del:focus-visible{opacity:1}
.addstep{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.addstep input{width:100%;border:0;background:transparent;font:500 16px var(--f-sans);padding:10px 0 10px 36px}
.addstep input::placeholder{color:#9b9b94}
.addstep input:focus{outline:none}

/* shoot: plan page and Shoot mode */
.sform{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;margin-top:30px}
.sform .f{display:flex;flex-direction:column;gap:20px}
.fld{display:flex;flex-direction:column;gap:8px}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px}
.row3 input,.sform textarea{border:0;border-bottom:2px solid var(--ink);background:transparent;font:600 19px var(--f-sans);padding:6px 0;width:100%;border-radius:0}
.sform textarea{font:500 16px/1.45 var(--f-sans);min-height:110px;resize:vertical}
.row3 input:focus,.sform textarea:focus{outline:none;border-bottom-color:var(--accent)}
.upload{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--ink);border-radius:6px;padding:14px 16px;cursor:pointer}
.upload.got{border-style:solid;background:var(--paper)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload b{font-weight:600}.upload span{color:var(--muted);font-size:13px}
.what{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:12px}

.slist{list-style:none;margin:24px 0 0;padding:0;border-top:2px solid var(--ink);max-width:820px}
.slist button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:16px 0;cursor:pointer}
.slist b{font:700 26px/1 var(--f-sans);letter-spacing:-.03em}
.slist span{font:500 12px var(--f-mono);color:var(--muted)}
.spine{list-style:none;margin:28px 0 0;padding:0;border-top:2px solid var(--ink)}
.spine>li{display:grid;grid-template-columns:70px minmax(0,4fr) minmax(0,6fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--hair)}
.spine time{font:500 12px var(--f-mono);color:var(--muted);padding-top:6px}
.spine h3{font:700 24px/1.05 var(--f-sans);letter-spacing:-.03em;margin:0}
.spine .where{font:500 12px var(--f-mono);color:var(--muted);margin-top:6px;display:block}
.spine .say{margin:10px 0 0;font:600 15px/1.35 var(--f-sans)}
.spine .say::before{content:"SAY  ";color:var(--accent);font:700 11px var(--f-sans);letter-spacing:.1em}
.spine li.open h3{color:var(--accent)}
.shots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.shots li{display:flex;gap:10px;align-items:baseline;font-size:14.5px}
.shots li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);transform:translateY(1px)}
.shots li.got::before{background:var(--accent);box-shadow:none}
.shots li em{font:500 11px var(--f-mono);font-style:normal;color:var(--muted);margin-left:auto;white-space:nowrap}
.smode{max-width:560px;display:flex;flex-direction:column;gap:18px;margin-top:26px;padding-top:20px;border-top:2px solid var(--ink)}
.sbar{display:flex;justify-content:space-between;font:600 12px var(--f-mono);color:var(--muted)}
.sbar b{color:var(--accent)}
.chapk{display:flex;justify-content:space-between;align-items:baseline}
.sdots{display:flex;gap:4px}.sdots i{width:16px;height:4px;background:var(--faint)}.sdots i.d{background:var(--ink)}.sdots i.c{background:var(--accent)}
.chap{font:700 clamp(40px,6vw,64px)/.95 var(--f-sans);letter-spacing:-.045em;margin:0}
.chapw{font:500 13px var(--f-mono);color:var(--muted);margin:-8px 0 0}
.shotbtn{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--paper);border-radius:14px;padding:16px;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--ink)}
.shotbtn i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink)}
.shotbtn b{font:700 18px/1.15 var(--f-sans)}
.shotbtn small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.shotbtn em{font:500 11px var(--f-mono);font-style:normal;color:var(--muted)}
.shotbtn.first{background:var(--ink);color:var(--paper);box-shadow:none}
.shotbtn.first i{box-shadow:inset 0 0 0 2px var(--accent)}
.shotbtn.first small,.shotbtn.first em{color:rgba(247,247,243,.65)}
.saycard{background:var(--accent);border-radius:14px;padding:16px}

.star[aria-pressed="true"]{color:var(--accent)}
.fixedl{margin:0;padding:0;list-style:none;font-size:15px}
.fixedl li{display:flex;gap:14px;padding:6px 0}
.fixedl time{font:500 12px var(--f-mono);color:var(--muted);width:90px;flex:none}
.wake{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;border-top:2px solid var(--ink);padding-top:12px}

@media (max-width:880px){.sform{grid-template-columns:minmax(0,1fr);gap:30px}.spine>li{grid-template-columns:1fr;gap:10px}.shots{grid-template-columns:1fr}.row3{grid-template-columns:1fr}}

#auth{max-width:440px;margin:60px 0;display:flex;flex-direction:column;gap:14px}

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm=m=>pad(Math.floor(m/60)%24)+":"+pad(Math.floor(m%60));
const t=s=>{const [h,m]=s.split(":").map(Number);return h*60+(m||0)};
const toMin=x=>{const m=String(x||"").match(/^(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null};
const isoDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>isoDate(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return isoDate(d)};
const dayIdx=d=>(d.getDay()+6)%7;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const dur=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?" "+r+" min":""}`:`${r} min`};
const hmin=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?`${h}<small>h</small> ${pad(r)}<small>m</small>`:`${r}<small>min</small>`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],WHEN={am:"morning",pm:"afternoon",eve:"evening",any:"any time"};
const weekday=iso=>new Date(iso+"T12:00").toLocaleDateString("en-GB",{weekday:"short"});
function showBanner(x){const b=$("#banner");b.textContent=x;b.hidden=!x}

/* ---------- your day: routine anchors; calendar events and sudden plans join them ---------- */
const DAY_START=t("09:00"),DAY_END=t("22:30");
const ROUTINE=[{s:"12:30",e:"13:15",name:"Lunch"},{s:"19:00",e:"19:45",name:"Dinner"},{s:"22:00",e:"22:30",name:"Wind down",always:true}];

/* ---------- recipes: his own steps per kind of job. A repeating stage runs once per 10 minutes of film ---------- */
const DEFAULT_RECIPES={
  wedding:{name:"Wedding film",stages:[
    {name:"Setup",steps:[["Download the raw footage, check every file",20],["Make the folders, create the project, import",20]]},
    {name:"Sort",steps:[["Label the cameras, split into scenes",20],["Sync all angles into multicams",30],["Write the scene list",10]]},
    {name:"Edit",repeat:true,steps:[["Watch the piece once",10],["Switch angles, cut the dead moments",30],["Tighten: trim pauses, fix the flow",10],["Audio check, save a new version",10]]},
    {name:"Finish",steps:[["Music and smooth audio",20],["Colour: one look for all cameras",15],["Titles, intro and outro",10],["Watch at 1.5×, note fixes",10],["Fix, export, back up twice",15]]}]},
  vlog:{name:"Daily vlog",stages:[{name:"Edit",steps:[["Dump today's clips in the vlog folder",5],["Cut the talking bits",10],["Lay the six parts in order",10],["Music, export and upload",5]]}]},
  travel:{name:"Travel doc",stages:[{name:"Sort",steps:[["Dump all clips, one folder per part",20],["Pick the best 3 shots per part",30]]},
    {name:"Cut",steps:[["Rough cut on the story spine",45],["Voice-over where a part needs it",20]]},
    {name:"Finish",steps:[["Music and sound: ambience under every part",20],["Colour: one look for the whole day",15],["Titles: place names, part cards",10],["Watch once, fix, export 16:9 and a 9:16 teaser",20]]}]},
  trailer:{name:"Trailer",stages:[]},promo:{name:"Promo",stages:[]},reel:{name:"Reel",stages:[]},
};
function pieces(len){const out=[];for(let a=0;a<len;a+=10)out.push(`${Math.floor(a/60)}:${pad(a%60)}–${Math.floor((a+10)/60)}:${pad((a+10)%60)}`);return out}
function stepsOf(k,len){const R=recipes[k];if(!R||!R.stages.length)return null;const out=[];
  for(const st of R.stages){if(st.repeat)pieces(len||30).forEach(pc=>st.steps.forEach(([x,m])=>out.push([`${x} · ${pc}`,m])));else st.steps.forEach(([x,m])=>out.push([x,m]))}return out}
function guessKind(name){const n=String(name).toLowerCase();
  // "Vivaah trailer" is a trailer; "Vivaah edit with trailer" is the film itself
  if(/trailer|highlight|teaser/.test(n)&&!/\bedit\b|film|ceremony|reception/.test(n))return "trailer";
  // a wedding job is an edit ("Vivaah edit", "Reception with trailer"), not "Invite people for weddings"
  if(/wedding|vivaah|vivah|shaadi|nikah|mehndi|reception|bruiloft/.test(n)&&/edit|film|video|trailer|reception|ceremony|highlight|cut/.test(n))return "wedding";
  if(/trailer|highlight|teaser/.test(n))return "trailer";if(/promo|commercial|\bad\b|advert/.test(n))return "promo";if(/\breel\b|short|tiktok/.test(n))return "reel";return null}

/* ---------- vlog: prompts by what you're doing, and a 4–5 minute outline in six parts ---------- */
const PROMPTS={
  edit:[["shoot","Your screen while you cut","10 sec. Lean the phone on the monitor so the timeline moves in frame."],["say","Which moment in this film made you smile?","Look at the lens. One sentence is enough."],
    ["shoot","Hands on the keyboard","5 sec, close and low from the side. Great between parts."],["say","How far is the film now?","Say the piece you're on, like '20 minutes in, 10 to go'."]],
  study:[["shoot","Your notes and coffee from above","5 sec. Phone straight down over the desk."],["say","One thing you just learned","In your own words, 15 seconds."]],
  work:[["say","What are you doing right now, and why?","15 seconds, like you're telling a friend."],["shoot","The thing you're working on","5 sec, close up."]],
  gym:[["shoot","Your first set","5 sec from the floor, phone against your bag."],["say","Why you didn't skip today","One honest sentence, out of breath is fine."]],
  habit:[["shoot","This habit in action","5 sec, close up."],["say","How does it feel to do this today?","One sentence."]],
};
const OUTLINE=[["Hook","0:00",20,2,0,t("10:00"),"Say the day in one line, like “Two days to deliver a wedding film.”"],["Morning work","0:20",70,3,t("10:00"),t("12:30"),"Desk, screen while working, one line on how it's going."],
  ["Lunch","1:30",45,2,t("12:30"),t("13:30"),"Walking, food, one sentence about the morning."],["Afternoon","2:15",60,3,t("13:30"),t("17:00"),"Gym or a habit, the work again, a short check-in."],
  ["Evening","3:15",45,2,t("17:00"),t("21:30"),"Going out, the shift, walking home."],["Outro","4:00",40,2,t("21:30"),t("24:00"),"What you finished, how it feels, what's next tomorrow."]];
const partOf=at=>OUTLINE.findIndex(o=>at>=o[4]&&at<o[5]);

/* ---------- state ---------- */
let db=null,sbClient=null,tab="now",active=null,activeKey="";
let sessions=[],jobs={},jobsLoaded=false,habits=[],recipes=JSON.parse(JSON.stringify(DEFAULT_RECIPES)),todoist=null,todayCal=null,came={},dumps=[],vlogs={},drifts={};
let dayset={},shoots={},openShoot=null,tomorrowCal=null,sdraft=null;
let toast=null,openKind="wedding",lenPrev=30,hdraft={name:"",per:3,min:30,when:"pm"};
const local=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

/* ---------- writes ---------- */
let chain=Promise.resolve();
function queue(fn){chain=chain.then(fn).catch(e=>showBanner("Couldn't save: "+(e&&e.message||e)+". Check your connection."));return chain}
const put=(path,data)=>{if(db)queue(()=>db.doc(path).set(data))};
function putJob(j){jobs={...jobs,[j.id]:j};put("jobs/"+j.id,j)}
function saveActive(){activeKey=JSON.stringify(active);if(db)queue(()=>active?db.doc("state/flow").set(active):db.doc("state/flow").delete())}

/* ---------- Todoist → jobs: each task becomes a job of small steps ---------- */
function dueOf(tk){if(tk.dueDate)return String(tk.dueDate).slice(0,10);const today=todayISO();if(tk.overdue)return addDays(today,-1);
  const x=String(tk.due||"").trim();if(/^\d{4}-\d{2}-\d{2}/.test(x))return x.slice(0,10);if(/^today/i.test(x))return today;if(/^tomorrow/i.test(x))return addDays(today,1);
  for(let i=0;i<7;i++){const d=addDays(today,i);if(x.toLowerCase().startsWith(weekday(d).toLowerCase()))return d}return null}
function syncJobs(){if(!todoist||!jobsLoaded||!db)return;const list=todoist.tasks||[],today=todayISO();
  for(const tk of list){const id="td_"+tk.id,due=dueOf(tk),j=jobs[id];
    if(j){const k=guessKind(tk.content),fresh=!j.len&&!(j.done||[]).length&&j.kind!==k;
      if(j.due!==due||j.name!==tk.content||fresh)putJob({...j,due,name:tk.content,...(fresh?{kind:k}:{})});if(fresh&&!stepsOf(k)&&!(j.steps||[]).length)splitJob(j);continue}
    const kind=guessKind(tk.content),nj={id,name:tk.content,due,kind,len:null,est:tk.minutes||null,steps:[],done:[],source:"todoist",createdAt:Date.now()};putJob(nj);
    if(!stepsOf(kind)&&(nj.est||30)>=45)splitJob(nj)}
  // a task that left Todoist was finished there; only trust a fresh sync, and only for tasks the sync window covers
  const span=todoist.days||2,ids=new Set(list.map(x=>"td_"+x.id));
  if(Date.now()-(todoist.syncedAt||0)<3*36e5)Object.values(jobs).forEach(j=>{if(j.source==="todoist"&&!j.archived&&!ids.has(j.id)&&(!j.due||j.due<=addDays(today,span-1)))putJob({...j,archived:true})})}
/* big job with no recipe: Gemini cuts it into small steps once, then it's stored */
async function splitJob(j){if(!sbClient)return;
  try{const {data,error}=await Promise.race([sbClient.functions.invoke("flow-chat",{body:{mode:"small",job:j.name,steps:[j.brief?`${j.name}. His briefing: ${j.brief}`:j.name],minutes:j.est||(j.size==="small"?40:j.size==="big"?120:60)}}),new Promise(r=>setTimeout(()=>r({error:1}),60000))]);
    if(error||!data||!Array.isArray(data.tasks))return;const steps=data.tasks.map(x=>[String(x.t||"").trim().slice(0,120),Math.max(2,Math.round(+x.min||10))]).filter(x=>x[0]);
    if(steps.length&&jobs[j.id])putJob({...jobs[j.id],steps})}catch(e){}}
/* size from the evening briefing stretches or shrinks the step times */
function jobSteps(j){const f=j.size==="small"?0.6:j.size==="big"?1.5:1,sc=L=>f===1?L:L.map(([x,m])=>[x,Math.max(2,Math.round(m*f))]);
  const r=j.kind&&stepsOf(j.kind,j.len||30);if(r)return sc(r);return sc(j.steps&&j.steps.length?j.steps:[[j.name,j.est||30]])}
const PEOPLE_RE=/\b(call|phone|ring|invite|invitation|text|message|whatsapp|email|e-mail|mail|contact|reach out|meet|bel|bellen|uitnodig)/i;
const isHard=j=>!!j.kind||(j.est||30)>=60;
const habitStep=h=>/gym/i.test(h.name)?"Gym: the full session":/read/i.test(h.name)?`Read ${h.min} minutes, phone away`:`${h.name}: ${h.min} minutes`;

/* everything that could be done today, as tasks of small steps */
function tasksToday(){const d=todayISO(),wd=dayIdx(new Date()),T=[];
  Object.values(jobs).filter(j=>!j.archived).forEach(j=>{const dn=new Set(j.done||[]),all=jobSteps(j),left=all.filter(([x])=>!dn.has(x));
    if(left.length)T.push({id:j.id,name:j.name,due:j.due,hard:isHard(j),all,left,kind:"job",job:j})});
  habits.filter(h=>habitDays(h).includes(wd)&&!(h.done||{})[d]).forEach(h=>T.push({id:"h:"+h.id,name:h.name,due:d,when:h.when==="any"?null:h.when,all:[[habitStep(h),h.min]],left:[[habitStep(h),h.min]],kind:"habit",habit:h}));
  const v=vlogs[d]||{},vdone=new Set(v.editDone||[]),vsteps=stepsOf("vlog")||[];
  if(vsteps.some(([x])=>!vdone.has(x)))T.push({id:"vlog",name:"Daily vlog",due:d,when:"eve",all:vsteps,left:vsteps.filter(([x])=>!vdone.has(x)),kind:"vlog"});
  return T}

/* fixed things today: routine, calendar, sudden plans. Routine that clashes with a real event steps aside (no dinner during a shift) */

function focusGrid(){const g={};sessions.forEach(s=>{if(!s.start||!s.minutes)return;const q=s.drifts!=null?Math.max(10,100-s.drifts*12):s.score;if(q==null)return;

/* ---------- data: Supabase docs table (same as the classic app) ---------- */
function supaDb(sb,uidv){
  const cache={},listeners={},loading={};
  const emit=c=>(listeners[c]||new Set).forEach(fn=>fn());
  async function load(c){const {data,error}=await sb.from("docs").select("id,data").eq("collection",c);if(error)throw error;cache[c]=new Map(data.map(r=>[r.id,r.data]));emit(c)}
  function sub(c,fn,err){(listeners[c]=listeners[c]||new Set).add(fn);if(cache[c])fn();else if(!loading[c])loading[c]=load(c).catch(e=>{loading[c]=null;err&&err(e)});return()=>listeners[c].delete(fn)}
  sb.channel("docs-"+uidv).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+uidv},p=>{
    const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.collection||!cache[row.collection])return;
    if(p.eventType==="DELETE")cache[row.collection].delete(row.id);else cache[row.collection].set(row.id,row.data);emit(row.collection)}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)Object.keys(cache).forEach(c=>load(c).catch(()=>{}))});
  const doc=(c,id)=>({
    async set(d){if(cache[c]){cache[c].set(id,d);emit(c)}const {error}=await sb.from("docs").upsert({user_id:uidv,collection:c,id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
    async delete(){if(cache[c]){cache[c].delete(id);emit(c)}const {error}=await sb.from("docs").delete().match({user_id:uidv,collection:c,id});if(error)throw error},
    onSnapshot(next,err){return sub(c,()=>{const m=cache[c];next({exists:m.has(id),data:()=>m.get(id)})},err)}
  });
  return{doc:p=>{const [c,id]=p.split("/");return doc(c,id)},
    collection:c=>({onSnapshot:(next,err)=>sub(c,()=>next({docs:[...cache[c]].map(([id,d])=>({id,data:()=>d}))}),err)})};
}
const recovering=/type=recovery/.test(location.hash);
async function connectSupabase(){
  const cfg=window.FLOW_CLOCK_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl){showBanner("Flow isn't connected to Supabase. Check config.js.");return null}
  const sb=sbClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let {data:{session}}=await sb.auth.getSession();
  if(session){const {error}=await sb.auth.getUser();if(error&&!/fetch|network/i.test(error.message||"")){await sb.auth.signOut({scope:"local"});session=null}}
  if(!session)session=await signIn(sb);
  if(recovering)await newPassword(sb);
  document.body.classList.remove("signed-out");
  $("#signout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  return supaDb(sb,session.user.id);
}

  db.collection("habits").onSnapshot(s=>{habits=s.docs.map(d=>({id:d.id,...d.data()}));re()},()=>{});
  db.doc("meta/recipes").onSnapshot(s=>{if(s.exists&&s.data().recipes)recipes={...JSON.parse(JSON.stringify(DEFAULT_RECIPES)),...s.data().recipes};re()},()=>{});
  db.doc("meta/todoist").onSnapshot(s=>{todoist=s.exists?s.data():null;syncJobs();re()},()=>{});
  db.doc("meta/today").onSnapshot(s=>{todayCal=s.exists?s.data():null;re()},()=>{});
  db.collection("days").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());dayset=m},()=>{});
  db.doc("meta/tomorrow").onSnapshot(s=>{tomorrowCal=s.exists?s.data():null},()=>{});
  db.collection("shoots").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());shoots=m;re()},()=>{});
  db.collection("came").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());came=m;re()},()=>{});
  db.collection("dump").onSnapshot(s=>{dumps=s.docs.map(d=>({id:d.id,...d.data()}));re()},()=>{});
  db.collection("vlog").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());vlogs=m;re()},()=>{});
  db.collection("drift").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());drifts=m},()=>{});
})();
})();
